<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Włącz Święta</title>
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Misja: Święta">
<meta name="theme-color" content="#f2f1ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">   <!-- the intro uses Poppins -->
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; height: 100dvh; background: #f2f1ec; }
  canvas { display: block; }
  html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* the on-screen buttons for a phone / tablet (shown only on a touch screen, or with ?touch in the address): left, right, down (the piggy bank), jump */
  #touch { position: fixed; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; display: none; z-index: 10; }
  body.touch #touch { display: block; }
  .tbtn { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,160,40,0.20); border: 2px solid rgba(255,205,90,0.85); box-shadow: 0 0 18px rgba(255,170,40,0.55), inset 0 0 14px rgba(255,200,80,0.22);
    transition: background 0.08s, transform 0.08s; }
  .tbtn svg { width: 46%; height: 46%; fill: none; stroke: #fff0b8; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(255,190,70,0.9)); }
  .tbtn.on { background: rgba(255,185,60,0.55); transform: scale(0.94); }
  #t-left, #t-right { width: clamp(78px, 21vmin, 116px); height: clamp(78px, 21vmin, 116px); bottom: max(44px, calc(env(safe-area-inset-bottom) + 26px)); }      /* (as big as the jump button) */
  #t-left { left: max(18px, env(safe-area-inset-left)); }
  #t-right { left: calc(max(18px, env(safe-area-inset-left)) + clamp(78px, 21vmin, 116px) + 14px); }
  #t-jump { width: clamp(90px, 24vmin, 132px); height: clamp(90px, 24vmin, 132px); right: max(60px, calc(env(safe-area-inset-right) + 40px)); bottom: max(86px, calc(env(safe-area-inset-bottom) + 68px)); }
  #t-down { width: clamp(56px, 14vmin, 80px); height: clamp(56px, 14vmin, 80px); right: calc(max(60px, calc(env(safe-area-inset-right) + 40px)) + clamp(90px, 24vmin, 132px) + 36px); bottom: max(56px, calc(env(safe-area-inset-bottom) + 38px)); }
  #t-tilt { left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%); width: auto; height: 34px; padding: 0 16px; border-radius: 17px; font: 700 14px Poppins, Arial, sans-serif; letter-spacing: 0.08em; color: #fff0b8; z-index: 11; }
  body.touch #t-tilt.avail { display: flex !important; }
  #t-full { left: calc(50% + 78px); top: max(10px, env(safe-area-inset-top)); width: 34px; height: 34px; z-index: 11; }
  body.touch #t-full.avail { display: flex !important; }
  #t-tilt.on { transform: translateX(-50%); }
  #t-toast { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 30; display: none; max-width: 80vw; padding: 8px 16px; border-radius: 12px; background: rgba(8,10,28,0.85); border: 1px solid rgba(255,205,90,0.8); color: #ffe9a0; font: 600 14px Poppins, Arial, sans-serif; text-align: center; pointer-events: none; }
  #t-rotate { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 20; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px;
    background: rgba(8,10,28,0.92); color: #ffe9a0; font: 700 20px Poppins, Arial, sans-serif; line-height: 1.4; pointer-events: auto; }
  @media (orientation: portrait) { body.touch #t-rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="tbtn" id="t-left" data-key="a"><svg viewBox="0 0 100 100"><path d="M62 18 L28 50 L62 82"/></svg></div>
  <div class="tbtn" id="t-right" data-key="d"><svg viewBox="0 0 100 100"><path d="M38 18 L72 50 L38 82"/></svg></div>
  <div class="tbtn" id="t-down" data-key="s"><svg viewBox="0 0 100 100"><path d="M18 36 L50 70 L82 36"/></svg></div>
  <div class="tbtn" id="t-jump" data-key=" "><svg viewBox="0 0 100 100"><path d="M18 64 L50 30 L82 64"/></svg></div>
</div>
<div class="tbtn" id="t-tilt" style="display:none">TILT</div>
<div class="tbtn" id="t-full" style="display:none"><svg viewBox="0 0 100 100"><path d="M14 38 L14 14 L38 14 M62 14 L86 14 L86 38 M86 62 L86 86 L62 86 M38 86 L14 86 L14 62"/></svg></div>
<div id="t-toast"></div>
<div id="t-rotate"><div>&#8635;<br>OBRÓĆ TELEFON POZIOMO</div></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
const TOUCH_SCREEN = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || /[?&]touch/.test(location.search);      // a phone / tablet (or ?touch in the address)
const MOBILE_VIEW_H = 800;      // on a touch screen the game is drawn as for a window this high (a small screen shows as much of the level as a big one: everything looks smaller)
let viewZoom = 1;
function resize() {
  viewZoom = TOUCH_SCREEN ? Math.max(0.35, Math.min(1, innerHeight / MOBILE_VIEW_H)) : 1;
  W = canvas.width = Math.round(innerWidth / viewZoom);
  H = canvas.height = Math.round(innerHeight / viewZoom);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';      // (the canvas is bigger than the window on a phone and is scaled down)
}
resize();
addEventListener('resize', resize);

const GROUND_Y_RATIO = TOUCH_SCREEN ? 0.86 : 0.793;      // (on a touch screen the table stands lower in the picture: less of the table front below, more of the room above)
// 0.793 on a desktop:   // 0.78 before: the hero (and the props that stand on his line) sit ~12 px lower  // (was 0.85 for the street) - higher, so the table front edge is visible below the feet
const UNIT = 46; // px per world unit

// ---- the on-screen buttons: they send the same key events as the keyboard (a = left, d = right, s = down, space = jump)
(function () {
  if (!TOUCH_SCREEN) return;
  document.body.classList.add('touch');
  // left / right work as one control: the finger can slide from one to the other without lifting it (the side of the middle between the two buttons decides)
  {
    const L = document.getElementById('t-left'), R = document.getElementById('t-right');
    let moveKey = null, movePtr = null;
    const setMove = k => {
      if (moveKey === k) return;
      if (moveKey) window.dispatchEvent(new KeyboardEvent('keyup', { key: moveKey, bubbles: true }));
      moveKey = k;
      L.classList.toggle('on', k === 'a'); R.classList.toggle('on', k === 'd');
      if (k) window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));
    };
    const pick = x => { const l = L.getBoundingClientRect(), r = R.getBoundingClientRect(); return x < (l.right + r.left) / 2 ? 'a' : 'd'; };
    for (const b of [L, R]) {
      b.addEventListener('pointerdown', e => { e.preventDefault(); if (movePtr !== null) return; movePtr = e.pointerId; try { b.setPointerCapture(e.pointerId); } catch (err) {} setMove(pick(e.clientX)); });
      b.addEventListener('pointermove', e => { if (e.pointerId === movePtr) setMove(pick(e.clientX)); });
      for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, e => { if (e.pointerId === movePtr) { movePtr = null; setMove(null); } });
      b.addEventListener('contextmenu', e => e.preventDefault());
    }
  }
  document.querySelectorAll('.tbtn[data-key]:not(#t-left):not(#t-right)').forEach(btn => {
    const key = btn.dataset.key;
    const press = () => { btn.classList.add('on'); window.dispatchEvent(new KeyboardEvent('keydown', { key: key, bubbles: true })); };
    const release = () => { btn.classList.remove('on'); window.dispatchEvent(new KeyboardEvent('keyup', { key: key, bubbles: true })); };
    let down = false;
    btn.addEventListener('pointerdown', e => { e.preventDefault(); if (down) return; down = true; try { btn.setPointerCapture(e.pointerId); } catch (err) {} press(); });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(ev, () => { if (!down) return; down = false; release(); });
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });
  document.addEventListener('gesturestart', e => e.preventDefault());       // (no pinch zoom)

  // ---- full screen (no address bar): the first tap switches it on where the browser allows (Android; an iPad); a small button does it too. An iPhone cannot do it for a web page:
  // there the game has to be added to the home screen (the manifest and the apple-... tags make it open without the address bar then)
  const root = document.documentElement, fsBtn = document.getElementById('t-full'), standalone = (navigator.standalone === true) || (typeof matchMedia === 'function' && matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches);
  const canFS = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const inFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const goFullscreen = async () => {
    try {
      if (!inFS()) { if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: 'hide' }); else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen(); }
      if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {});
    } catch (err) {}
  };
  const leaveFullscreen = () => { try { if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } catch (err) {} };
  if (canFS && !standalone) {
    fsBtn.classList.add('avail');
    fsBtn.addEventListener('pointerdown', e => { e.preventDefault(); if (inFS()) leaveFullscreen(); else goFullscreen(); });
    let tried = false;
    addEventListener('pointerup', () => { if (!tried) { tried = true; goFullscreen(); } }, { passive: true });       // the very first tap anywhere
  }
  if (!canFS && !standalone && /iPhone|iPod/.test(navigator.userAgent)) {
    try { if (!localStorage.getItem('fsHintShown')) { localStorage.setItem('fsHintShown', '1'); setTimeout(() => { const t = document.getElementById('t-toast'); t.textContent = 'Pełny ekran: Udostępnij → Dodaj do ekranu głównego'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 6000); }, 1500); } } catch (err) {}
  }

  // ---- tilting the phone as an alternative to the buttons: the right / left edge down = run right / left, the top edge up = jump (relative to the way the phone was held when TILT was switched on)
  const tiltBtn = document.getElementById('t-tilt'), toast = document.getElementById('t-toast');
  if (typeof DeviceOrientationEvent === 'undefined') return;
  tiltBtn.classList.add('avail');
  const say = msg => { toast.textContent = msg; toast.style.display = 'block'; clearTimeout(say.t); say.t = setTimeout(() => toast.style.display = 'none', 3200); };
  let tiltOn = false, base = null, lastEv = 0;
  const held = { a: false, d: false, ' ': false };
  const setKey = (k, want) => { if (held[k] === want) return; held[k] = want; window.dispatchEvent(new KeyboardEvent(want ? 'keydown' : 'keyup', { key: k, bubbles: true })); };
  const releaseAll = () => { for (const k in held) setKey(k, false); };
  const screenAngle = () => (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (typeof window.orientation === 'number' ? window.orientation : 0);
  const onOrient = e => {
    if (!tiltOn || e.beta === null || e.beta === undefined) return;
    lastEv = performance.now();
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    const ux = -Math.sin(g) * Math.cos(b), uy = Math.sin(b);                       // where "up" is, in the phone's own axes
    const ang = ((screenAngle() % 360) + 360) % 360;
    const sx = ang === 90 ? -uy : ang === 270 ? uy : ang === 180 ? -ux : ux;        // ... in the axes of the screen as it is held now (sx: along the screen's right, sy: along its top)
    const sy = ang === 90 ? ux : ang === 270 ? -ux : ang === 180 ? -uy : uy;
    if (!base) base = { sx: sx, sy: sy };
    const dx = sx - base.sx, dy = sy - base.sy;
    setKey('d', held.d ? dx < -0.09 : dx < -0.17);         // the right edge down: right (the left edge down: dx > 0)
    setKey('a', held.a ? dx > 0.09 : dx > 0.17);
    setKey(' ', held[' '] ? dy > 0.12 : dy > 0.3);          // the top edge up: jump
  };
  const off = () => { tiltOn = false; base = null; releaseAll(); tiltBtn.classList.remove('on'); };
  tiltBtn.addEventListener('pointerdown', async e => {
    e.preventDefault();
    if (tiltOn) { off(); say('Sterowanie przechyłem: wyłączone'); return; }
    try {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {           // iPhone: the permission has to be asked for in a tap
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') { say('Brak zgody na czujniki ruchu'); return; }
      }
    } catch (err) { say('Czujniki ruchu niedostępne'); return; }
    window.removeEventListener('deviceorientation', onOrient); window.addEventListener('deviceorientation', onOrient);
    tiltOn = true; base = null; lastEv = 0; tiltBtn.classList.add('on');
    say('Przechyl: prawo / lewo = bieg, do góry = skok');
    setTimeout(() => { if (tiltOn && !lastEv) { off(); say('Czujniki wymagają połączenia HTTPS'); } }, 1600);
  });
})();
const keys = {};
// the jump has priority over the other movements: a press is remembered for JUMP_BUFFER_MS (a short tap that is over before the next frame, a press a moment before the landing,
// a press while the game was busy are not lost) and the jump is still possible for COYOTE_MS after the hero has left the ground (a frame in the air over a step or an edge)
const JUMP_BUFFER_MS = 160, COYOTE_MS = 110;
let jumpBufferUntil = 0, lastGroundedAt = -1e9;
addEventListener('keydown', e => {
  ensureAudio();
  startMusic();
  if (introActive) { introKey(e, performance.now()); return; }
  if (levelEnd.phase === 'card' || levelEnd.phase === 'next') { levelEndKey(e, performance.now()); return; }                                   // idempotent: starts the music with the first key press (browsers need a gesture)
  if (e.key.toLowerCase() === 'm' && !e.repeat) toggleMusic();
  // the jump sound plays the moment the key goes down (not in the next frame of the game loop)
  const jk = e.key.toLowerCase();
  if (!e.repeat && (jk === 'w' || jk === 'arrowup' || jk === ' ') && player.onGround && !(keys['s'] || keys['arrowdown']) && player.state !== 'meditate' && player.state !== 'meditate_in') {
    lastJumpSoundAt = performance.now();
    playJump();
  }
  if (!e.repeat && (jk === 'w' || jk === 'arrowup' || jk === ' ')) jumpBufferUntil = performance.now() + JUMP_BUFFER_MS;
  keys[e.key.toLowerCase()] = true;
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
addEventListener('pointerdown', () => {          // a click / a tap: starts the sound and moves the intro on
  ensureAudio(); startMusic();
  if (introActive) introNext(performance.now());
});
for (const ev of ['mousedown', 'touchstart', 'click']) addEventListener(ev, () => { ensureAudio(); startMusic(); }, { passive: true });      // (any click or tap unlocks the sound too)
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let audioCtx = null;
let lastJumpSoundAt = -Infinity;   // the jump sound is played from the key press; the game loop does not repeat it right after
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function noiseBuffer(duration) {
  const sr = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, Math.max(1, Math.floor(sr * duration)), sr);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}

function playThud(freq, noiseDur, noiseFilterFreq, vol, pitchDur) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;

  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer(noiseDur);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = noiseFilterFreq;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(vol, t0);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + noiseDur);
  src.connect(filter).connect(noiseGain).connect(audioCtx.destination);
  src.start(t0);
  src.stop(t0 + noiseDur);

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.6, t0 + pitchDur);
  const oscGain = audioCtx.createGain();
  oscGain.gain.setValueAtTime(vol * 0.8, t0);
  oscGain.gain.exponentialRampToValueAtTime(0.001, t0 + pitchDur);
  osc.connect(oscGain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + pitchDur);
}

// the scrape of an obstacle being pushed over the table: an even, steady rubbing noise that fades in and out while the hero pushes
let scrape = null;
const SCRAPE_VOL = 0.11;
function updatePushSound(active) {
  if (!audioCtx) return;
  if (!scrape) {
    if (!active) return;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer(2);
    src.loop = true;
    const band = audioCtx.createBiquadFilter();
    band.type = 'bandpass'; band.frequency.value = 520; band.Q.value = 0.6;
    const low = audioCtx.createBiquadFilter();
    low.type = 'lowpass'; low.frequency.value = 1100;
    const env = audioCtx.createGain();       // fades in/out
    env.gain.value = 0;
    const wobble = audioCtx.createGain();    // only a faint, slow wobble so the sound stays even
    wobble.gain.value = 0.95;
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine'; lfo.frequency.value = 5;
    const lfoDepth = audioCtx.createGain();
    lfoDepth.gain.value = 0.04;
    lfo.connect(lfoDepth).connect(wobble.gain);
    src.connect(band).connect(low).connect(env).connect(wobble).connect(audioCtx.destination);
    src.start(); lfo.start();
    scrape = { env };
  }
  scrape.env.gain.setTargetAtTime(active ? SCRAPE_VOL : 0, audioCtx.currentTime, active ? 0.05 : 0.08);
}

// the jump: a quick springy upward "boing" with a soft whoosh
function playJump() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(260, t0);
  osc.frequency.exponentialRampToValueAtTime(620, t0 + 0.12);
  osc.frequency.exponentialRampToValueAtTime(480, t0 + 0.22);
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(0.0001, t0);
  og.gain.linearRampToValueAtTime(0.16, t0 + 0.006);
  og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
  osc.connect(og).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.25);

  const sw = audioCtx.createBufferSource();
  sw.buffer = noiseBuffer(0.2);
  const f = audioCtx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.setValueAtTime(700, t0);
  f.frequency.exponentialRampToValueAtTime(2400, t0 + 0.18);
  f.Q.value = 0.8;
  const sg = audioCtx.createGain();
  sg.gain.setValueAtTime(0.0001, t0);
  sg.gain.linearRampToValueAtTime(0.07, t0 + 0.02);
  sg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
  sw.connect(f).connect(sg).connect(audioCtx.destination);
  sw.start(t0);
  sw.stop(t0 + 0.2);
}

function playFootstep() {
  // a dull step, close to the sound of a landing but softer: a low thump (a short low-passed noise and a quick falling low tone), a little different every time
  playThud(78 + Math.random() * 16, 0.07, 360 + Math.random() * 100, 0.2, 0.1);
}
function playLanding() { playThud(75, 0.09, 500, 0.35, 0.16); }

// the hero's place on the screen while the camera follows him (share of the window width from the left)
const CAM_HERO_SCREEN_X = 0.38;
// where he first appears (the camera is at the start of the level then, so this is also his place on the screen); a bit left of the following position
const HERO_START_SCREEN_X = 0.28;
// he appears in the air this many px above the table and falls onto it (also after falling into a pit)
const DROP_IN_PX = 170;
const START_DROP_PX = 1000;            // at the very start of the game he falls from a much higher point (after a fall into a pit he still drops in from DROP_IN_PX)
const player = {
  x: Math.round(W * HERO_START_SCREEN_X), y: -START_DROP_PX, vx: 0, vy: 0,
  onGround: false, facing: 1,
  speed: 0, state: 'idle', animPhase: 0, stepBucket: -1,
  stand: null,   // the floating plank (ISLANDS entry) he is standing on, or null
};

const GRAVITY = 120;   // was 85: the jump took too long (floaty)
const RUN_ACCEL = 140;
const RUN_MAX = 32;   // was 40: a bit slower run (about 1470 px/s)
const FRICTION = 66;
const JUMP_V = 37.5;   // was 38, 34 before: the jump is ~0.625 s and ~270 px high (EXACTLY, whatever the frame rate: see the integration of player.y; with the old integration it was ~262 px at 60 fps, ~248 at 30)
const DOUBLE_TAP_MS = 300;
const AIR_MAX_SPEED = 24;   // world units/s (ground top speed is 40): a full-speed jump carries ~700 px instead of ~1470
const AIR_DECEL = 420;      // units/s^2 (must beat the run acceleration of 140, or a held direction key would cancel the limit)

let camX = 0;
let prevKeys = {};
let lastDownTapTime = -Infinity;
function justPressed(k) { return keys[k] && !prevKeys[k]; }

function lerp(a, b, t) { return a + (b - a) * t; }

const INTRO_V = '20261028e';            // bump this after replacing any file of the intro (pictures, sound): the browser then loads the new file instead of the one it kept
const ALL_IMAGES = [];                  // every picture the game loads (the loading screen counts how many of them are done: `complete` is true after a load AND after a failed load)
function loadImage(src) {
  const img = new Image();
  const state = { loaded: false };
  img.onload = () => state.loaded = true;
  img.src = src.startsWith('intro/') ? src + '?v=' + INTRO_V : src;
  ALL_IMAGES.push(img);
  return { img, state };
}
const START_IMG = loadImage('intro/start.jpg');       // the first screen (the title picture with the loading bar), the first picture to load

// all three layers are the same 4666x1408 render split by depth, so they share one
// scale and one ground row (measured where bg_layer_2's street begins)
const bgLayer1 = loadImage('assets/bg_layer_1.jpg');
const bgLayer2 = loadImage('assets/bg_layer_2.webp');
const bgLayer3 = loadImage('assets/bg_layer_3.webp');
const BG_GROUND_RATIO = 0.774;

function drawBgLayer(layer, parallax, lift) {
  if (!layer.state.loaded) return;
  const groundY = H * GROUND_Y_RATIO;
  const img = layer.img;
  const dh = groundY / BG_GROUND_RATIO;
  const dw = dh * (img.naturalWidth / img.naturalHeight);
  const top = groundY - dh * BG_GROUND_RATIO - (lift || 0);

  const offset = ((camX * parallax) % dw + dw) % dw;
  let sx = -offset - dw;
  while (sx < W) {
    ctx.drawImage(img, sx, top, dw, dh);
    sx += dw;
  }
}

// flying eye enemies: wander randomly around a home point, aim at wherever the player
// currently is, and fire an angled bullet at either head-height or leg-height (world px
// above ground, same coordinate space as player foot height): HEAD_BULLET_H sits between
// a crouching and a standing head, so ducking avoids it; LEG_BULLET_H sits low near the
// ground, so only a jump clears it. Land on top of one from above (falling) and it dies,
// drops to the floor, and can then be pushed/rolled around like a ball.
const EYE_R = 30;
const EYE_BOB_AMOUNT = 8;
const EYE_BOB_SPEED = 1.6;
const EYE_SHOT_INTERVAL_MIN = 1400;
const EYE_SHOT_INTERVAL_MAX = 2600;
const EYE_WANDER_SPEED = 55; // world px/sec while roaming
const EYE_WANDER_RADIUS_X = 220;
const EYE_WANDER_RADIUS_Y = 160;
const EYE_RETARGET_MIN = 1200;
const EYE_RETARGET_MAX = 2600;
const EYE_MIN_Y = 70;  // some eyes now roam low enough to block the road itself
const EYE_MAX_Y = 480; // ...while others stay well up high

function makeEye(homeX, homeY, nextShotIn, bobOffset) {
  return {
    homeX, homeY, x: homeX, y: homeY,
    tx: homeX, ty: homeY, retargetIn: 400 + Math.random() * 800,
    bobOffset, nextShotIn,
    alive: true, onGround: false, fallVy: 0, rollVx: 0, rotation: 0,
    hasLanded: false, lookX: 0,
  };
}

// spaced well apart along the road, alternating low (road-blocking) and high perches
// enemies are switched off for now (new Christmas enemies will come with the new graphics);
// put the makeEye(...) entries back here to re-enable the flying eyes
const EYES = [];
const EYES_DISABLED_BACKUP = [
  makeEye(900, 90, 1200, 0),
  makeEye(2000, 320, 2000, 2.1),
  makeEye(3100, 130, 1600, 4.2),
  makeEye(4200, 420, 2400, 1.1),
];

function eyesInRange(minX, maxX) {
  return EYES.filter(eye => eye.x >= minX - 300 && eye.x <= maxX + 300);
}

// standing/running head height and crouching head height (world px above the feet),
// measured from the sprite frames so the duck/jump windows line up with what's on screen
const STAND_HEAD_H = 275;
const CROUCH_HEAD_H = 225;
const HEAD_BULLET_H = 250; // above CROUCH_HEAD_H, below STAND_HEAD_H -- crouch ducks it
const LEG_BULLET_H = 25;   // near the ground -- only a jump clears it, crouch doesn't help
const ENEMY_SHOT_SPEED = 210; // world px/sec
const ENEMY_SHOT_R = 10;
const HERO_HIT_HALF_WIDTH = 60;
const HIT_INVULN_MS = 1000;
// matches the body-damage check's own vertical reach exactly, so there's no gap where a
// falling player is "too low for a stomp" but "already inside the damage zone" -- that gap
// meant a legitimate stomp could cost a life on the frame just before it registered as a kill
const STOMP_ABOVE = EYE_R;
const STOMP_BELOW = EYE_R;
const STOMP_BOUNCE_V = 16; // upward kick the player gets from stomping an eye
const ROLL_FRICTION = 1.4; // per-second decay factor for a rolling dead eye -- low, so it coasts a good distance before gradually stopping

let enemyShots = [];
let lives = 5;
let invulnUntil = 0;

function playerHeadHeight() {
  return player.state === 'crouch' ? CROUCH_HEAD_H : STAND_HEAD_H;
}

function updateEyeWander(eye, dt) {
  eye.retargetIn -= dt * 1000;
  if (eye.retargetIn <= 0) {
    eye.tx = eye.homeX + (Math.random() * 2 - 1) * EYE_WANDER_RADIUS_X;
    eye.ty = Math.min(EYE_MAX_Y, Math.max(EYE_MIN_Y, eye.homeY + (Math.random() * 2 - 1) * EYE_WANDER_RADIUS_Y));
    eye.retargetIn = EYE_RETARGET_MIN + Math.random() * (EYE_RETARGET_MAX - EYE_RETARGET_MIN);
  }
  const dx = eye.tx - eye.x, dy = eye.ty - eye.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 2) {
    eye.x += (dx / dist) * EYE_WANDER_SPEED * dt;
    eye.y += (dy / dist) * EYE_WANDER_SPEED * dt;
  }
}

function spawnEyeShot(eye) {
  const isLeg = Math.random() < 0.5;
  const targetY = isLeg ? LEG_BULLET_H : HEAD_BULLET_H;
  const dx = player.x - eye.x;
  const dy = targetY - eye.y;
  const dist = Math.hypot(dx, dy) || 1;
  const shot = {
    worldX: eye.x,
    y: eye.y,
    vx: (dx / dist) * ENEMY_SHOT_SPEED,
    vy: (dy / dist) * ENEMY_SHOT_SPEED,
  };
  enemyShots.push(shot);
  playEyeShoot();
  startShotBuzz(shot);
}

function startShotBuzz(shot) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.value = 130;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.045;
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  shot.buzzOsc = osc;
  shot.buzzGain = gain;
}

function stopShotBuzz(shot) {
  if (!shot.buzzOsc) return;
  const t0 = audioCtx.currentTime;
  shot.buzzGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.05);
  shot.buzzOsc.stop(t0 + 0.06);
  shot.buzzOsc = null;
}

function updateEyes(dt, now) {
  const footHeight = -player.y;

  for (const eye of eyesInRange(camX - 200, camX + W + 200)) {
    if (eye.alive) {
      updateEyeWander(eye, dt);
      eye.nextShotIn -= dt * 1000;
      if (eye.nextShotIn <= 0) {
        spawnEyeShot(eye);
        eye.nextShotIn = EYE_SHOT_INTERVAL_MIN + Math.random() * (EYE_SHOT_INTERVAL_MAX - EYE_SHOT_INTERVAL_MIN);
      }

      // stomp kill: player falling from above, roughly overlapping the eye's position
      const isStomp =
        player.vy > 0 &&
        Math.abs(player.x - eye.x) < EYE_R + 40 &&
        footHeight <= eye.y + STOMP_ABOVE &&
        footHeight >= eye.y - STOMP_BELOW;

      if (isStomp) {
        eye.alive = false;
        eye.fallVy = 0;
        // freeze its gaze at the moment of death -- it no longer tracks the player after this
        eye.lookX = Math.max(-1, Math.min(1, (player.x - eye.x) / 400)) * EYE_R * 0.35;
        playStomp();
        playEyeDeath();
        player.vy = -STOMP_BOUNCE_V;
      } else if (
        now >= invulnUntil &&
        Math.abs(player.x - eye.x) < EYE_R + HERO_HIT_HALF_WIDTH &&
        eye.y + EYE_R >= footHeight &&
        eye.y - EYE_R <= footHeight + playerHeadHeight()
      ) {
        // running into a live eye from the side (or below/through it) costs a life too
        onPlayerHit(now);
      }
    } else if (!eye.onGround) {
      eye.fallVy += GRAVITY * dt;
      eye.y -= eye.fallVy * dt * UNIT;
      if (eye.y <= EYE_R) {
        eye.y = EYE_R;
        if (!eye.hasLanded) { playEyeLand(); eye.hasLanded = true; }
        if (eye.fallVy > 4) {
          eye.fallVy *= -0.4; // small spring off the ground before it settles
        } else {
          eye.fallVy = 0;
          eye.onGround = true;
        }
      }
    } else {
      // resting on the ground -- roll away from the player if they walk into it, like a ball.
      // triggers on plain overlap (not on a speed threshold) so even a slow walk-in pushes it,
      // and the direction comes from which side the player is on, not their current vx sign.
      if (player.onGround) {
        const overlapDist = HERO_HIT_HALF_WIDTH + EYE_R;
        const dist = player.x - eye.x;
        // only (re)kick it while it's essentially at rest -- otherwise a player who runs
        // faster than the decaying roll can overtake it mid-roll, flip which side they're
        // on, and shove it right back the way it came on the very next frame
        if (Math.abs(dist) < overlapDist && Math.abs(eye.rollVx) < 40) {
          const pushDir = dist >= 0 ? -1 : 1;
          // player.vx is in world-units/sec (like player.x's own integration), not raw px/sec --
          // has to be scaled by UNIT here since eye.x moves in raw px/sec, same as everywhere else
          const pushSpeed = Math.max(Math.abs(player.vx) * UNIT * 0.6, 250);
          eye.rollVx = pushDir * pushSpeed;
        }
      }
      if (eye.rollVx !== 0) {
        eye.x += eye.rollVx * dt;
        eye.rotation += (eye.rollVx * dt) / EYE_R;
        eye.rollVx *= Math.max(0, 1 - ROLL_FRICTION * dt);
        if (Math.abs(eye.rollVx) < 1) eye.rollVx = 0;
      }
    }
  }

  enemyShots.forEach(shot => {
    shot.worldX += shot.vx * dt;
    shot.y += shot.vy * dt;
  });
  enemyShots = enemyShots.filter(shot => {
    const keep = Math.abs(shot.worldX - player.x) < W;
    if (!keep) stopShotBuzz(shot);
    return keep;
  });

  if (now >= invulnUntil) {
    for (const shot of enemyShots) {
      if (shot.hit) continue;
      if (Math.abs(shot.worldX - player.x) > HERO_HIT_HALF_WIDTH + ENEMY_SHOT_R) continue;
      const foot = -player.y;
      const head = foot + playerHeadHeight();
      if (shot.y >= foot - 6 && shot.y <= head + 6) {
        shot.hit = true;
        stopShotBuzz(shot);
        onPlayerHit(now);
      }
    }
  }
}

function onPlayerHit(now) {
  lives = Math.max(0, lives - 1);
  invulnUntil = now + HIT_INVULN_MS;
  playBonk();
}

function drawEye(eye, now) {
  const groundY = worldGroundY();
  const bob = eye.alive ? Math.sin(now / 1000 * EYE_BOB_SPEED + eye.bobOffset) * EYE_BOB_AMOUNT : 0;
  const sx = eye.x - camX;
  const sy = groundY - eye.y - bob;

  // no shadow while flying -- only once it has died and is falling/resting on the ground
  if (!eye.alive) shadowBlob(sx, groundY - 4, EYE_R * 0.9, 0.18);

  ctx.save();
  ctx.translate(sx, sy);
  if (!eye.alive) ctx.rotate(eye.rotation);

  ctx.beginPath();
  ctx.arc(0, 0, EYE_R, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  const lookX = eye.alive
    ? Math.max(-1, Math.min(1, (player.x - eye.x) / 400)) * EYE_R * 0.35
    : eye.lookX;
  ctx.beginPath();
  ctx.arc(lookX, EYE_R * 0.05, EYE_R * 0.5, 0, Math.PI * 2);
  ctx.fillStyle = '#4a4a4a';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(lookX, EYE_R * 0.05, EYE_R * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = '#1a1a1a';
  ctx.fill();

  ctx.restore();
}

function drawEnemyShots() {
  const groundY = worldGroundY();
  for (const shot of enemyShots) {
    const sx = shot.worldX - camX;
    const sy = groundY - shot.y;
    const jx = (Math.random() - 0.5) * 5;
    const jy = (Math.random() - 0.5) * 5;

    // light chromatic-split glitch: faint offset ghost copies behind the core dot
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.arc(sx + jx + 3, sy + jy, ENEMY_SHOT_R * 0.85, 0, Math.PI * 2);
    ctx.fillStyle = '#34e619';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sx + jx - 3, sy + jy, ENEMY_SHOT_R * 0.85, 0, Math.PI * 2);
    ctx.fillStyle = '#00d9ff';
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(sx + jx, sy + jy, ENEMY_SHOT_R, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1a1a';
    ctx.fill();
  }
}

function drawEyes(now) {
  for (const eye of eyesInRange(camX - 200, camX + W + 200)) drawEye(eye, now);
}

function heartPath(cx, cy, size) {
  ctx.beginPath();
  const topY = cy - size * 0.3;
  ctx.moveTo(cx, cy + size * 0.65);
  ctx.bezierCurveTo(cx - size * 1.1, cy - size * 0.15, cx - size * 0.5, topY - size * 0.6, cx, topY);
  ctx.bezierCurveTo(cx + size * 0.5, topY - size * 0.6, cx + size * 1.1, cy - size * 0.15, cx, cy + size * 0.65);
  ctx.closePath();
}

// ---- the levitating heart icons on the map: big, glowing, bobbing in the air; touching one gives back a life (only when a heart is missing)
const HEART_PICKUP_SIZE = 96;          // px on the screen (the icon in the corner is 46 px)
const HEART_PICKUP_R = 46;             // px: radius of the touch zone
const heartBursts = [];                // { x, y (world), t0 } a ring of light where a heart was taken
const flyingHearts = [];               // { x0, y0 (screen), t0 }: a taken heart flying up to the hearts in the corner; the life is added when it arrives
const HEART_FLY_MS = 750;
function playHeartPickup() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [[660, 0], [880, 0.09], [1320, 0.18]].forEach(([f, d]) => {
    const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(f, t0 + d);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0 + d); g.gain.linearRampToValueAtTime(0.14, t0 + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.35);
    o.connect(g).connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + 0.4);
  });
}
function resetHeartPickups() { for (const h of HEART_PICKUPS) h.taken = false; flyingHearts.length = 0; }
function playHeartArrive() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(1568, t0);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.12, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
  o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + 0.32);
}
function updateHeartPickups(now) {
  if (lives + flyingHearts.length >= 5) return;                    // all hearts are full (counting the ones on their way): the icons stay where they are
  const foot = -player.y;
  for (const h of HEART_PICKUPS) {
    if (h.taken || Math.abs(h.x - player.x) > 200) continue;
    const dx = Math.max(Math.abs(h.x - player.x) - 28, 0);
    const top = foot + 250;                                         // the hero is a column from his feet up to ~250 px
    const dy = h.y < foot ? foot - h.y : (h.y > top ? h.y - top : 0);
    if (Math.hypot(dx, dy) < HEART_PICKUP_R) {
      h.taken = true;                                              // the icon vanishes here; a heart flies off from where it was to the corner
      const bob = Math.sin(now / 1000 * 2.2 + h.phase) * 11;
      flyingHearts.push({ x0: h.x - camX, y0: worldGroundY() - h.y - bob, t0: now });
      heartBursts.push({ x: h.x, y: h.y, t0: now });
      playHeartPickup();
    }
  }
}
function drawHeartPickups(now) {
  const img = HEART_IMG;
  if (!img.state.loaded) return;
  const groundY = worldGroundY();
  const tt = now / 1000;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  for (const h of HEART_PICKUPS) {
    if (h.taken) continue;
    const sx = h.x - camX;
    if (sx < -150 || sx > W + 150) continue;
    const bob = Math.sin(tt * 2.2 + h.phase) * 11;                  // levitates up and down
    const sy = groundY - h.y - bob;
    const pulse = 1 + 0.05 * Math.sin(tt * 3.1 + h.phase);
    const sz = HEART_PICKUP_SIZE * pulse;
    // the glow: a warm amber halo that breathes (added light)
    const gr = sz * 1.15, ga = 0.38 + 0.14 * Math.sin(tt * 3.1 + h.phase);
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, gr);
    g.addColorStop(0, `rgba(255,205,90,${ga})`); g.addColorStop(0.5, `rgba(255,170,60,${ga * 0.35})`); g.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g; ctx.fillRect(sx - gr, sy - gr, gr * 2, gr * 2);
    ctx.restore();
    // the icon
    const k = sz / (HEART_BB[2] - HEART_BB[0]);
    ctx.drawImage(img.img, sx - (HEART_BB[0] + (HEART_BB[2] - HEART_BB[0]) / 2) * k, sy - (HEART_BB[1] + (HEART_BB[3] - HEART_BB[1]) / 2) * k, img.img.naturalWidth * k, img.img.naturalHeight * k);
    // two little twinkles going round it
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const ang = tt * 1.6 + i * 2.09 + h.phase, rr = sz * 0.62;
      const tx = sx + Math.cos(ang) * rr, ty = sy + Math.sin(ang) * rr * 0.8;
      const ta = 0.35 + 0.35 * Math.sin(tt * 6 + i * 2 + h.phase);
      const tg = ctx.createRadialGradient(tx, ty, 0, tx, ty, 9);
      tg.addColorStop(0, `rgba(255,240,180,${ta})`); tg.addColorStop(1, 'rgba(255,240,180,0)');
      ctx.fillStyle = tg; ctx.fillRect(tx - 9, ty - 9, 18, 18);
    }
    ctx.restore();
  }
  // a ring of light where one was just taken
  for (let i = heartBursts.length - 1; i >= 0; i--) {
    const b = heartBursts[i], u = (now - b.t0) / 600;
    if (u >= 1) { heartBursts.splice(i, 1); continue; }
    const bx = b.x - camX, by = groundY - b.y;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(255,215,110,${0.8 * (1 - u)})`; ctx.lineWidth = 6 * (1 - u) + 1;
    ctx.beginPath(); ctx.arc(bx, by, 30 + 110 * u, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// a taken heart flies in an arc to the empty slot of the corner row; when it gets there the life is added
function drawFlyingHearts(now) {
  const img = HEART_IMG;
  const size = 46, gap = 8, startX = W - 20 - size, y = 18;
  for (let k = flyingHearts.length - 1; k >= 0; k--) {
    const f = flyingHearts[k], u = Math.min(1, (now - f.t0) / HEART_FLY_MS);
    const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;      // ease in-out
    const idx = Math.min(4, lives + k);                                         // the slot it flies to
    const tx = startX - idx * (size + gap) + size / 2, ty = y + size / 2;
    const x = f.x0 + (tx - f.x0) * e, yy = f.y0 + (ty - f.y0) * e - Math.sin(Math.PI * e) * 70;    // an arc upwards
    const sz = HEART_PICKUP_SIZE + (size - HEART_PICKUP_SIZE) * e;
    // a glow and a short trail of light
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let tr = 4; tr >= 0; tr--) {
      const eu = Math.max(0, e - tr * 0.04), ex = f.x0 + (tx - f.x0) * eu, ey = f.y0 + (ty - f.y0) * eu - Math.sin(Math.PI * eu) * 70;
      const rr = sz * (0.7 - tr * 0.1), ga = 0.30 * (1 - tr * 0.2);
      const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, rr);
      g.addColorStop(0, `rgba(255,215,100,${ga})`); g.addColorStop(1, 'rgba(255,215,100,0)');
      ctx.fillStyle = g; ctx.fillRect(ex - rr, ey - rr, rr * 2, rr * 2);
    }
    ctx.restore();
    if (img.state.loaded) {
      const kk = sz / (HEART_BB[2] - HEART_BB[0]);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img.img, x - (HEART_BB[0] + (HEART_BB[2] - HEART_BB[0]) / 2) * kk, yy - (HEART_BB[1] + (HEART_BB[3] - HEART_BB[1]) / 2) * kk, img.img.naturalWidth * kk, img.img.naturalHeight * kk);
    }
    if (u >= 1) {                                                               // arrived: one more life
      flyingHearts.splice(k, 1);
      lives = Math.min(5, lives + 1);
      playHeartArrive();
    }
  }
}

// ---- the coins: they glow, bob and turn; the hero collects them by touching; the counter is in the top left corner
// 18 frames of the coin turning (every other one of the 37 cut from coin.mp4: half a turn from edge to edge; both faces are the same, so it loops), 160 x 160 px, the coin is 154 px across
const COIN_FRAME_COUNT = 18;
const COIN_FRAMES = Array.from({ length: COIN_FRAME_COUNT }, (_, i) => loadImage('assets/level_1/coin_spin/coin_' + String(i).padStart(2, '0') + '.webp'));
const COIN_FRAME_PX = 160, COIN_DIAMETER_PX = 154;
const COIN_FPS = 11;
function coinFrame(tt, offset, fps) {                // the image of the turning coin at time tt (s), shifted by `offset` frames
  const i = Math.floor(((tt * fps + offset) % COIN_FRAME_COUNT + COIN_FRAME_COUNT) % COIN_FRAME_COUNT);
  const f = COIN_FRAMES[i];
  return f.state.loaded ? f.img : null;
}
const COIN_SIZE = 72;                  // px on the screen (was 52)
const COIN_R = 38;                     // px: touch radius (was 30)
let coinCount = 0, coinPopAt = -1e9, lastCoinSound = -1e9, coinCombo = 0;
const coinBursts = [];                 // { x, y (world), t0 }
function playCoin(now) {
  if (!audioCtx) return;
  coinCombo = (now - lastCoinSound < 900) ? Math.min(coinCombo + 1, 8) : 0;          // coins taken in a row go up the scale
  lastCoinSound = now;
  const f = 1046.5 * Math.pow(2, [0, 2, 4, 5, 7, 9, 11, 12, 14][coinCombo] / 12);
  const t0 = audioCtx.currentTime;
  [[f, 0], [f * 1.5, 0.05]].forEach(([fr, d]) => {
    const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(fr, t0 + d);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0 + d); g.gain.linearRampToValueAtTime(0.09, t0 + d + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.22);
    o.connect(g).connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + 0.25);

function playBonk() { playThud(220, 0.05, 1200, 0.28, 0.09); }
function playEyeShoot() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const dur = 0.12;

  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(1800, t0);
  osc.frequency.exponentialRampToValueAtTime(220, t0 + dur);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(4000, t0);
  filter.frequency.exponentialRampToValueAtTime(600, t0 + dur);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.18, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

  osc.connect(filter).connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur);
}

function playEyeDeath() {
  if (!audioCtx) return;

function shadowBlob(sx, groundY, w, alpha, flat) {

  flat = flat || 0.13;
  ctx.save();
  ctx.translate(sx, groundY);
  ctx.scale(1, flat);

  g.addColorStop(0, `rgba(0,0,0,${alpha})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');

function loadFrames(folder, prefix, count) {
  const frames = [];

  for (let i = 0; i < count; i++) {
    const img = new Image();
    img.src = `assets/${folder}/${prefix}_${String(i).padStart(2, '0')}.webp`;

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  const y = Math.round(Math.max(0, Math.min(camY, CAM_Y_MAX)) * BG_V_PARALLAX - headroom);   // (the background stays put while the camera goes down into a pit)
  for (let n = first; n <= last; n++) {
    ctx.drawImage(img, Math.round(n * bw - off), y, bw + 1, hbg);
  }
}

function drawPlaceholderBg() {
  // plain warm gradient until the real level-1 background arrives
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f8e7c8');
  g.addColorStop(0.6, '#f3c9a3');
  g.addColorStop(1, '#e9a98a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// draws the table image (or the end cap) at dx; the plain cabinet part is stretched down to the screen bottom
function drawTableImage(img, dx, dw, top, mirrored, srcTop) {
  srcTop = srcTop || 0;
  const s = TABLE_SCALE, split = TABLE_SPLIT_ROW, nh = img.naturalHeight;
  const upperTop = top + srcTop * s;
  const topH = (split - srcTop) * s;
  const lowerTop = upperTop + topH;
  const lowerH = Math.max((nh - split) * s, H - lowerTop + 2);
  ctx.save();
  if (mirrored) { ctx.translate(dx + dw, 0); ctx.scale(-1, 1); dx = 0; }
  ctx.drawImage(img, 0, srcTop, img.naturalWidth, split - srcTop, dx, upperTop, dw + 1, topH + 1);
  ctx.drawImage(img, 0, split, img.naturalWidth, nh - split, dx, lowerTop, dw + 1, lowerH);
  ctx.restore();
}

function drawTable() {
  if (!tableImg.state.loaded) return;
  const img = tableImg.img;
  if (img.naturalWidth !== TABLE_IMG_W && !drawTable.warned) { drawTable.warned = true; console.warn('level1_ground.webp is ' + img.naturalWidth + ' px wide, TABLE_IMG_W says ' + TABLE_IMG_W + ' - table segments will not end on tile edges'); }
  const groundY = worldGroundY();
  const s = TABLE_SCALE;
  const tw = img.naturalWidth * s;
  const top = groundY - TABLE_FEET_ROW * s;
  const capLoaded = tableCapImg.state.loaded;
  const cw = capLoaded ? tableCapImg.img.naturalWidth * s : 0;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  for (const [a, b] of TABLE_SEGS) {
    if (b < camX - cw || a > camX + W + cw) continue;
    const sa = Math.round(a - camX);
    const sb = Math.round(Math.min(b, camX + W + 20) - camX);
    // table body, clipped to the segment; every other tile is mirrored so tile seams stay invisible
    ctx.save();
    ctx.beginPath();
    ctx.rect(sa, 0, sb - sa, H);
    ctx.clip();
    const first = Math.floor((camX - a) / tw), last = Math.floor((camX + W - a) / tw);
    for (let n = first; n <= last; n++) {
      // both edges of a tile are snapped to whole pixels (drawTableImage adds 1 px of overlap): no gap, no visible seam
      const x0 = Math.round(a + n * tw - camX), x1 = Math.round(a + (n + 1) * tw - camX);
      drawTableImage(img, x0, x1 - x0, top, ((n % 2) + 2) % 2 === 1, BODY_TRIM);
    }
    ctx.restore();
    // end caps: normal on the left end, mirrored on the right end of a segment
    if (capLoaded) {
      const ov = CAP_OVERLAP * s, capTop = top + CAP_DY * s;
      if (a > 0) drawTableImage(tableCapImg.img, Math.round(a - cw + ov - camX), cw, capTop, false, CAP_TRIM);   // no left end cap at the very start of the level
      if (b !== Infinity) drawTableImage(tableCapImg.img, Math.round(b - ov - camX), cw, capTop, true, CAP_TRIM);
    }
  }
}

function drawPains() {
  const groundY = worldGroundY();
  ctx.imageSmoothingEnabled = true;

// the puddles are hot: soft wisps of steam rise from them, sway, grow and fade
function drawSteam(sx, w, baseY, seed) {
  const tt = performance.now() / 1000;
  const n = Math.max(4, Math.round(w / 55));
  ctx.save();
  for (let i = 0; i < n; i++) {

function drawFloorDecor() {
  const groundY = worldGroundY();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  for (const q of FLOOR_DECOR) {

// ---- the tipping book: hit in a jump, high on its spine, it falls over away from the hero (like a felled tree) and lies down as a bridge

  if (!t.state.loaded) return;
  const sx = o.x - camX;
  if (sx > W + 50 || sx + o.w < -50) return;
  const baseY = groundY + OB_BASE_DY + (t.dy || 0) - (o.base || 0) - (o.drawLift || 0) + extraDy;      // (drawLift: drawn further back on the table, the hero's feet stay where they are)

// the steam of the hot coffee: soft warm-white wisps rise from the opening of the cup, curl a little and fade
function drawCupSteam(t, sx, baseY, o) {
  const tt = performance.now() / 1000, k = t.s;
  const x0 = sx + (270 - t.bb[0]) * k, y0 = baseY - (t.bb[3] - 52) * k;          // the middle of the coffee surface (picture px 270, 52)
  const n = 9;
  ctx.save();

    const u = (tt * 0.22 + i / n + o.x * 0.0007) % 1;
    const spread = (((i * 0.618) % 1) - 0.5) * 120 * k * 2.2;                      // where over the opening this wisp starts

// the big plants: drawn over the hero (he runs along the rim of the pot, behind the leaves)

  const groundY = worldGroundY();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  for (const o of OBSTACLES) {
    if (!o.fg || o.gone) continue;
    const t = OB_TYPES[o.type];

    const imgX = sx - (t.potLeft !== undefined ? t.potLeft : t.bb[0]) * t.s, imgW = t.img.naturalWidth * t.s;

function drawObstacles() {
  const groundY = worldGroundY();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  drawRuler(groundY);       // (under the piggy bank that stands on it)
  // the books are drawn first: the headphones pushed up to them stand in front of the books
  for (const o of OBSTACLES.filter(q => q.back).concat(OBSTACLES.filter(q => !q.back)).sort((p, q) => (p.zOrder || 0) - (q.zOrder || 0))) {

// the highest solid surface under x that the hero's feet are at or above (table = 0, obstacle tops = their height, island tops)
let supportIsland = null;   // set by supportHeight(): the plank that is the highest surface under the hero, or null
function supportHeight(x, prevFoot) {
  let best = tableUnder(x) ? 0 : null;
  let isl = null;
  for (const c of CARDS) {
    if (c.gone || c.falling) continue;
    const ix = c.w * CARD_INSET;
    if (x >= c.x + ix - OB_EDGE && x <= c.x + c.w - ix + OB_EDGE && c.h <= prevFoot + 2) {
      if (best === null || c.h > best) { best = c.h; isl = null; }
    }
  }
  for (const o of ISLANDS) {
    if (o.x > x + 600 || o.x + o.w < x - 600) continue;
    if (x >= o.x + ISL_INSET - OB_EDGE && x <= o.x + o.w - ISL_INSET + OB_EDGE && o.h <= prevFoot + 2) {
      if (best === null || o.h > best) { best = o.h; isl = o; }
    }
  }
  for (const o of OBSTACLES) {
    if (o.gone || o.falling) continue;
    if (OB_TYPES[o.type].candle || OB_TYPES[o.type].thorny || o.ghost) continue;          // the candle and the cactus are not stood on: falling on it from above hurts
    if (o.x > x + 300 || o.x + o.w < x - 300) continue;

    const sh = (o.base || 0) + (o.slope ? topAt(o, x) : o.h) - OB_STAND_DY - (o.tip && o.tip.state === 'stand' ? TIP_STAND_SINK : 0);       // (o.base: it stands on a plank; on the top of a standing tipping book the hero stands a little lower)

// hero holds it a little lower, a jump pushes it down again, and it springs back when he is gone
const ISL_SPRING_K = 220, ISL_SPRING_C = 14;    // stiffness / damping: about one and a half wobbles

    const loaded = player.stand === o && player.onGround;
    if (!loaded && o.dy === 0 && o.vdy === 0) continue;

    o.vdy += (-ISL_SPRING_K * (o.dy - target) - ISL_SPRING_C * o.vdy) * dt;

function shadowSurfaceHeight(x, foot) {
  let best = tableUnder(x) ? 0 : null;

  for (const o of ISLANDS) {
    if (x >= o.x + ISL_INSET && x <= o.x + o.w - ISL_INSET && o.h <= foot + 2 && (best === null || o.h > best)) { best = o.h; shadowIsland = o; }

function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function musicTone(t, midi, dur, type, amp, cutoff, decay) {
  const osc = audioCtx.createOscillator();
  const filt = audioCtx.createBiquadFilter();

  osc.type = type;
  osc.frequency.value = midiFreq(midi);

  filt.frequency.value = cutoff;

  g.gain.linearRampToValueAtTime(amp, t + 0.008);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, amp * (decay || 0.35)), t + dur * 0.85);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  osc.connect(filt).connect(g).connect(musicGain);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// a glockenspiel / music-box bell: a sine plus two inharmonic partials that die away faster than the fundamental
function bellTone(t, midi, dur, amp) {
  const f = midiFreq(midi);
  for (const [ratio, a, len] of [[1, 1, 1], [2.76, 0.32, 0.45], [5.4, 0.12, 0.22]]) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f * ratio;
    const d = Math.max(0.12, dur * len);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amp * a, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0002, t + d);
    osc.connect(g).connect(musicGain);
    osc.start(t);
    osc.stop(t + d + 0.02);
  }
}

function musicNoiseBurst(t, dur, ftype, freq, amp) {
  const src = audioCtx.createBufferSource();
  src.buffer = musicNoise;
  const filt = audioCtx.createBiquadFilter();
  filt.type = ftype;
  filt.frequency.value = freq;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(amp, t);
  g.gain.exponentialRampToValueAtTime(0.0002, t + dur);
  src.connect(filt).connect(g).connect(musicGain);
  src.start(t);
  src.stop(t + dur + 0.02);
}

    osc.start(t);
    osc.stop(t + 0.12);

function musicKick(t) {

  const g = audioCtx.createGain();
  osc.frequency.setValueAtTime(140, t);
  osc.frequency.exponentialRampToValueAtTime(48, t + 0.11);

  osc.stop(t + 0.17);

function scheduleMusicStep(step, t) {

function scheduleTenseStep(step, t) {

  for (let i = 0; i < PIG_FLY.length; i++) {
    const f = PIG_FLY[i], u = (now - f.t0 - f.delay) / f.dur;
    if (u < 0 || u >= 1) continue;
    const a = f.dir === 'in' ? hud : pig, b = f.dir === 'in' ? pig : hud, e = u * u * (3 - 2 * u);
    const x = a.x + (b.x - a.x) * e, y = a.y + (b.y - a.y) * e - Math.sin(Math.PI * u) * 110;
    const cimg = coinFrame(now / 1000, i * 1.7, 14);
    if (!cimg) continue;
    const k = size / COIN_DIAMETER_PX, side = COIN_FRAME_PX * k;
    ctx.drawImage(cimg, x - side / 2, y - side / 2, side, side);
  }
  ctx.restore();
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (introActive) { drawIntro(now); requestAnimationFrame(frame); return; }

  const painLock = now < hurtLockUntil;                // hurt: the controls are locked for a moment
  const leftDown = !painLock && (keys['a'] || keys['arrowleft']);
  const rightDown = !painLock && (keys['d'] || keys['arrowright']);
  const leftPressed = !painLock && (justPressed('a') || justPressed('arrowleft'));
  const rightPressed = !painLock && (justPressed('d') || justPressed('arrowright'));
  const downPressed = justPressed('s') || justPressed('arrowdown');
  const upPressed = !painLock && (justPressed('w') || justPressed('arrowup') || justPressed(' '));
  const meditating = player.state === 'meditate_in' || player.state === 'meditate';
  if (downPressed && !painLock && heroOnPig()) pigToggle(now);      // standing on the piggy bank: down loads / unloads the coins

  if (meditating && (leftPressed || rightPressed || upPressed)) {
    setState('idle');
    player.vx = 0;
  }

  if (player.state === 'meditate_in' || player.state === 'meditate') {
    player.vx = 0;
    player.vy = 0;
    player.speed = 0;
  } else {
    const crouchHeld = (keys['s'] || keys['arrowdown']) && player.onGround;

    // right after a landing the hero squats: for that moment he cannot run forward (no input, speed dies away)
    const landingSquat = player.onGround && now - landStart < LAND_MS;

    let input = 0;
    if (!crouchHeld && !landingSquat) {
      if (leftDown) input -= 1;
      if (rightDown) input += 1;
    }

    if (input !== 0) {
      player.vx += input * RUN_ACCEL * dt;
      player.vx = Math.max(-RUN_MAX, Math.min(RUN_MAX, player.vx));
      player.facing = input > 0 ? 1 : -1;
    } else {
      const sign = Math.sign(player.vx);
      const decel = crouchHeld ? FRICTION * 2.5 : FRICTION;
      player.vx -= sign * Math.min(Math.abs(player.vx), decel * dt);
    }
    if (landingSquat) player.vx *= Math.exp(-LAND_DAMP * dt);

    // jumps used to carry the hero far too far: in the air the speed is eased down to AIR_MAX_SPEED
    if (!player.onGround && Math.abs(player.vx) > AIR_MAX_SPEED) {
      player.vx -= Math.sign(player.vx) * Math.min(Math.abs(player.vx) - AIR_MAX_SPEED, AIR_DECEL * dt);
    }

    if (player.onGround) lastGroundedAt = now;
    const wantJump = upPressed || now < jumpBufferUntil;
    const canJump = player.onGround || (now - lastGroundedAt < COYOTE_MS && player.vy >= -2);      // (not right after a jump: no double jump)
    if (wantJump && canJump && !crouchHeld) {
      jumpBufferUntil = 0;
      const tramp = trampActive(player.x);                                  // the free end of the held ruler: a much stronger jump
      player.vy = -JUMP_V * (tramp ? TRAMP_BOOST : 1);
      if (tramp) { RULER.vdy -= 380; playTrampoline(); }
      player.onGround = false;
      if (performance.now() - lastJumpSoundAt > 150) playJump();   // (normally already played by the key press)
      if (player.stand) player.stand.vdy += ISL_JUMP_KICK;   // pushing off presses the plank down
    }

    const wasAirborne = !player.onGround;

    const vyBefore = player.vy;                       // (the height is integrated with the AVERAGE speed of the frame: exact for a constant gravity, so a jump is the same height at 20, 30, 60 or 120 frames a second)
    player.vy += GRAVITY * dt;
    player.x += player.vx * dt * UNIT;
    if (player.x < PLAYER_MIN_X) { player.x = PLAYER_MIN_X; if (player.vx < 0) player.vx = 0; }
    resolveObstacleSides();
    const cardDir = updateCards(dt);
    const updateCardsPushing = cardDir !== 0;
    const pushDir = cardDir || updateMovables(dt);
    heroPushing = pushDir !== 0 && player.onGround && Math.abs(player.vx) > 1;
    updatePushSound(heroPushing);
    const limit = pushDir !== 0 && updateCardsPushing ? PUSH_MAX_SPEED : pushLimit;
    if (pushDir !== 0 && player.onGround && player.vx * pushDir > limit) {
      // pushing a card: the hero slows down to a walk
      player.vx -= pushDir * Math.min(player.vx * pushDir - limit, PUSH_DECEL * dt);
    }
    // a low obstacle is walked onto and off: the feet follow its top without a jump
    if (player.onGround && !wasAirborne) {
      const sh = stepSurface(player.x);
      const desired = sh !== null ? sh : (player.onStep && tableUnder(player.x) ? 0 : null);
      if (desired !== null && Math.abs(-player.y - desired) <= OB_STEP_MAX) player.y = -desired;
      player.onStep = sh !== null && player.y === -sh;
    } else {
      player.onStep = false;
    }
    const prevFoot = -player.y;
    player.y += (vyBefore + player.vy) / 2 * dt * UNIT;
    const footHeight = -player.y;
    const support = supportHeight(player.x, prevFoot);
    // landing only from above: a hero already below the table line (fallen into a pit) must not snap up onto the next table
    if (support !== null && player.vy >= 0 && footHeight <= support && prevFoot >= support - 0.5) {
      const impact = player.vy * UNIT;      // px/s: how hard he lands
      player.y = -support;
      player.vy = 0;
      player.onGround = true;
      player.stand = supportIsland;
      if (wasAirborne && supportIsland) supportIsland.vdy += Math.min(impact * ISL_LAND_KICK, ISL_LAND_KICK_MAX);
      const seg = tableUnder(player.x);
      if (seg) { lastSegStart = seg[0]; lastSafeX = Math.min(Math.max(player.x, seg[0] + 160), seg[1] - 160); }
      if (wasAirborne) { playLanding(); landStart = now; }
      if (wasAirborne && trampActive(player.x)) {                          // landing on the free end of the held ruler: it throws the hero up again
        RULER.vdy += Math.min(impact * 0.25, 420);
        player.vy = -JUMP_V * TRAMP_BOOST; player.onGround = false; player.stand = null; playTrampoline();
      }
    } else {
      player.onGround = false;   // in the air, or over a pit
      player.stand = null;
    }
    updateIslands(dt);
    if (player.y > FALL_DEATH_PX) fallDeath(now);
    updatePains(now);
    updatePigRuler(now, dt);
    updateEnemy(now);
    musicModeWant = (FINAL.state !== 'burnt' && player.x > FINAL_PLUG_X - 2400) ? 'tense' : 'calm';      // near the jammer the music is the tense one
    updateCup(now, dt);
    applyCupDip(now, dt);
    updateHeartPickups(now);
    updateCoins(now);
    const camYJump = Math.min(CAM_JUMP_MAX, Math.max(0, -player.y - CAM_JUMP_START) * CAM_JUMP_FACTOR);          // a jump lifts the camera a little
    const camYHead = Math.max(0, CAM_FEET_MIN_Y - (H * GROUND_Y_RATIO + player.y));                              // high up (planks): as much as needed, no more
    const camYUp = Math.min(CAM_Y_MAX, Math.max(camYJump, camYHead));   // (player.y < 0 = up)
    const camYDown = -Math.min(CAM_Y_DOWN_MAX, Math.max(0, player.y - 20) * CAM_Y_DOWN_FACTOR);   // falling below the table line: the camera follows a little
    const finalNeed = Math.max(0, FINAL.devTopH + 28 - H * GROUND_Y_RATIO);        // how far the camera has to go down to show the top of the jammer in this window
    const finalLift = FINAL.state === 'burnt' ? 0 : Math.max(0, Math.min(1, (2800 - Math.abs(player.x - FINAL.devCx)) / 700)) * Math.min(CAM_Y_MAX, finalNeed);   // lifts the camera near the jammer
    const camYTarget = camYUp + camYDown + finalLift;
    camY += (camYTarget - camY) * Math.min(1, CAM_Y_RATE * dt);

    player.speed = player.vx;

    if (!player.onGround) setState('jump');
    else if (crouchHeld) setState('crouch');
    else if (Math.abs(player.speed) > 0.4) setState('run');
    else setState('idle');
  }

  const runAnimSpeed = Math.abs(player.speed);
  player.animPhase += dt * ANIM_RATE[player.state] *
    (player.state === 'run' ? ((heroPushing ? RUN_MAX : runAnimSpeed) / RUN_MAX * 0.7 + 0.3) : 1);

  if (player.state === 'run') {
    const fi = Math.floor(player.animPhase) % RUN_LOOP_COUNT;
    const bucket = Math.floor(fi / (RUN_LOOP_COUNT / 2));
    if (bucket !== player.stepBucket) {
      playFootstep();
      player.stepBucket = bucket;
    }
  } else {
    player.stepBucket = -1;
  }

  prevKeys = { ...keys };

  camX = lerp(camX, player.x - W * CAM_HERO_SCREEN_X, Math.min(1, 6 * dt));
  camX = Math.max(camX, 0, PLAYER_MIN_X - 180);   // the camera stays at the start of the level (the table fills the left edge); with the left wall it stops 180 px before it

  updateEyes(dt, now);
  updateFinal(dt, now);
  updateTipBooks(now);
  updateLevelEnd(now);
  if (levelEnd.phase === 'none') updateHint(now);
  const shk = finalShakeOffset(now);
  ctx.save(); ctx.translate(shk[0], shk[1]);       // (the picture shakes when the cable explodes)

  if (USE_OLD_STREET_BG) {
    drawBgLayer(bgLayer1, 0.25, H * 0.06);
    drawBgLayer(bgLayer2, 1, H * 0.1);
  } else {
    drawLevelBg();
    drawTable();
    drawBackProps();
    drawJutrek(now);
    drawFloorDecor();
    drawPains();          // (the painful objects are drawn first: the candle and all other obstacles stand in front of them)
    drawObstacles();
    drawCards();
    drawIslands(false);
  }
  drawCoins(now);
  drawHeartPickups(now);
  drawHintPickup(now);
  drawPigUi(now);
  drawCoffeeFx(now);
  drawEyes(now);
  drawEnemyShots();
  drawPlayer(now);
  drawHeroSteam(now);
  if (!USE_OLD_STREET_BG) drawForeground();   // (the big plants: in front of the hero)
  if (!USE_OLD_STREET_BG) drawIslands(true);   // middle/upper planks in front of the hero
  ctx.restore();
  drawFinalOverlay(now);
  if (USE_OLD_STREET_BG) drawBgLayer(bgLayer3, 1, H * 0.1);
  drawHearts();
  drawEnemy(now);
  drawCoinCounter(now);
  drawPigFly(now);
  drawHintBanner(now);
  drawSoundPrompt(now);
  drawLevelEnd(now);

  requestAnimationFrame(frame);
}
const START_AT_PIG = typeof location !== 'undefined' && !START_AT_FINAL && (/[?&]pig/.test(location.search) || (START_AT_PIG_DEFAULT && !/[?&](begin|x=)/.test(location.search)));
if (START_AT_PIG && PIG_O) {                    // the hero appears before the piggy bank and brings all the coins that lie before it (to try the ruler quickly)
  player.x = PIG_O.x0 - 450; player.y = -DROP_IN_PX;
  camX = Math.max(0, player.x - W * CAM_HERO_SCREEN_X);
  lastSafeX = player.x;
  pigNeed();
  for (const c of COINS) if (c.x < RULER.x0) { c.taken = true; coinCount++; }      // (the coin behind the piggy bank is not collected: one has to fetch it)
}
if (START_AT_FINAL) {                          // ?final in the address: the game starts in front of the jammer
  player.x = FINAL_START_X; player.y = -DROP_IN_PX;
  camX = Math.max(0, player.x - W * CAM_HERO_SCREEN_X);
  lastSafeX = FINAL_START_X;
}
{ // ?x=29000 in the address: start at that place of the level (to try a part of it quickly)
  const m = typeof location !== 'undefined' ? /[?&]x=(\d+)/.exec(location.search) : null;
  if (m) { player.x = +m[1]; player.y = -DROP_IN_PX; camX = Math.max(0, player.x - W * CAM_HERO_SCREEN_X); lastSafeX = player.x; }
}
requestAnimationFrame(frame);
</script>
</body>
