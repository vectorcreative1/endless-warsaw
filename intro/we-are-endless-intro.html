<title>We Are Endless Intro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* Layout: one 16:9 stage centred on black, a thin control strip under it. Single dark look by choice. */
  :root {
    --bg: #050505;
    --stage: #000000;
    --red: #e3151a;
    --ink: #f2eeee;
    --muted: #8a7f80;
    --line: #2a1213;
    --display: "Special Gothic Expanded One", "Arial Black", Impact, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .stage {
    width: min(100%, calc((100vh - 110px) * 16 / 9));
    max-width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--stage);
    outline: 1px solid var(--line);
  }
  canvas { display: block; width: 100%; height: 100%; }
  .bar {
    width: min(100%, calc((100vh - 110px) * 16 / 9));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  button {
    font: inherit;
    letter-spacing: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--red);
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover { background: var(--red); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--red); }
  input[type="range"] { flex: 1 1 200px; min-width: 0; accent-color: var(--red); }
  .tc { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 11ch; text-align: right; }
</style>

<div class="stage"><canvas id="c" width="1920" height="1080" aria-label="Animated intro: WE ARE ENDLESS in red on black with glitch effects"></canvas></div>
<div class="bar">
  <button id="play" type="button">Pause</button>
  <button id="loop" type="button" aria-pressed="true">Loop</button>
  <input id="scrub" type="range" min="0" max="8" step="0.001" value="0" aria-label="Timeline">
  <span class="tc" id="tc">00:00:00</span>
</div>

<script>
(() => {
  const W = 1920, H = 1080, DUR = 8, FPS = 24;
  const RED = '#e3151a', CYAN = '#18e4ff', WHITE = '#ffffff';
  const DISPLAY = '"Special Gothic Expanded One", "Arial Black", Impact, sans-serif';
  const MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; };
  const [L, lx] = mk();   // text layer
  const [T, tx] = mk();   // tinted copy for channel split
  const [M, mx] = mk();   // composite before slicing

  // ---------- helpers ----------
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const oc = x => 1 - Math.pow(1 - x, 3);
  const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const oe = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
  function rng(seed) {
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const bump = (t, c, w) => Math.max(0, 1 - Math.abs(t - c) / w);

  // grain tile
  const [G, gx] = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; return [c, c.getContext('2d')]; })();
  { const img = gx.createImageData(256, 256), r = rng(99);
    for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 22; }
    gx.putImageData(img, 0, 0); }
  // scanline pattern
  const SL = document.createElement('canvas'); SL.width = 4; SL.height = 4;
  { const s = SL.getContext('2d'); s.fillStyle = 'rgba(0,0,0,.35)'; s.fillRect(0, 0, 4, 1); }
  const slPat = ctx.createPattern(SL, 'repeat');

  // fit a word into a box, return metrics
  const cache = {};
  function fit(word, maxW, maxH) {
    const k = word + maxW + maxH;
    if (cache[k]) return cache[k];
    lx.font = `100px ${DISPLAY}`;
    const m = lx.measureText(word);
    const asc = m.actualBoundingBoxAscent, dsc = m.actualBoundingBoxDescent;
    const s = Math.min(maxW / m.width, maxH / (asc + dsc));
    return (cache[k] = { size: 100 * s, w: m.width * s, asc: asc * s, dsc: dsc * s });
  }

  // draw a word centred at (cx, cy) with outline progress, fill amount, scale
  function word(g, text, cx, cy, maxW, maxH, o) {
    const f = fit(text, maxW, maxH);
    g.save();
    g.translate(cx, cy);
    g.scale(o.scale || 1, (o.scale || 1) * (o.sy || 1));
    g.font = `${f.size}px ${DISPLAY}`;
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    const by = (f.asc - f.dsc) / 2;
    if (o.echo) {
      // endless tunnel of outlines receding outward
      for (let i = 0; i < o.echo.n; i++) {
        const ph = (i + o.echo.phase) / o.echo.n;
        const sc = 1 + ph * o.echo.spread;
        g.save();
        g.scale(sc, sc);
        g.globalAlpha = (1 - ph) * o.echo.alpha;
        g.lineWidth = 2 / sc;
        g.strokeStyle = RED;
        g.strokeText(text, 0, by);
        g.restore();
      }
    }
    if (o.ghost) {
      g.save();
      g.lineWidth = 3;
      g.strokeStyle = WHITE;
      g.globalAlpha = o.ghost.a;
      g.strokeText(text, o.ghost.dx, by + o.ghost.dy);
      g.restore();
    }
    if (o.fill > 0) {
      g.globalAlpha = o.fill;
      g.fillStyle = RED;
      g.fillText(text, 0, by);
      g.globalAlpha = 1;
    }
    if (o.stroke > 0) {
      const len = f.size * 6;
      g.setLineDash([len * o.stroke, len]);
      g.lineDashOffset = 0;
      g.lineWidth = o.lw || 3;
      g.strokeStyle = o.strokeColor || RED;
      g.globalAlpha = o.strokeAlpha ?? 1;
      g.strokeText(text, 0, by);
      g.setLineDash([]);
    }
    g.restore();
    return f;
  }

  // flicker: fill appears with a few stepped on/off frames
  const flick = (t, a, R) => { const p = seg(t, a, a + .22); return p >= 1 ? 1 : (p > 0 ? (R() < p ? 1 : .15) : 0); };

  // ---------- timeline ----------
  const HITS = [0.42, 1.5, 2.62, 3.45, 4.7, 6.15, 7.05];
  function glitchAmt(t, R) {
    let g = 0;
    for (const h of HITS) g = Math.max(g, bump(t, h, .16));
    if (t > 7.3) g = Math.max(g, seg(t, 7.3, 7.55));
    if (R() < .07) g = Math.max(g, .25 + R() * .25);
    return g;
  }

  function scene(g, t, R) {
    g.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;

    // A — WE
    if (t >= .3 && t < 1.5) {
      const st = oc(seg(t, .3, .9));
      const out = seg(t, 1.38, 1.5);
      word(g, 'WE', cx, cy, W * .86, H * .74, {
        scale: 1 + seg(t, .3, 1.5) * .07,
        sy: 1 - io(out),
        stroke: st, lw: 4,
        fill: flick(t, .8, R),
        ghost: { a: .35 * seg(t, .85, 1), dx: 18, dy: 12 }
      });
    }
    // B — ARE
    if (t >= 1.5 && t < 2.62) {
      const st = oc(seg(t, 1.5, 2.0));
      const out = seg(t, 2.5, 2.62);
      word(g, 'ARE', cx, cy, W * .9, H * .7, {
        scale: 1.08 - seg(t, 1.5, 2.62) * .08,
        sy: 1 - io(out),
        stroke: st, lw: 4,
        fill: flick(t, 1.92, R),
        ghost: { a: .35 * seg(t, 1.95, 2.1), dx: -18, dy: 12 }
      });
    }
    // C — ENDLESS with tunnel
    if (t >= 2.62 && t < 4.7) {
      const st = oc(seg(t, 2.62, 3.25));
      const fillOn = flick(t, 3.35, R);
      const tun = seg(t, 2.9, 3.4) * (1 - seg(t, 4.45, 4.7));
      word(g, 'ENDLESS', cx, cy, W * .9, H * .5, {
        scale: 1 + seg(t, 2.62, 4.7) * .04,
        stroke: st, lw: 3,
        fill: fillOn,
        echo: tun > 0 ? { n: 14, phase: (t * 1.4) % 1, spread: 2.6, alpha: .55 * tun } : null,
        ghost: { a: .3 * fillOn, dx: 16, dy: 14 }
      });
    }
    // D — lockup
    if (t >= 4.7) {
      const off = t > 7.35 ? seg(t, 7.35, 7.6) : 0;
      const sy = 1 - io(off);
      g.save();
      g.translate(0, cy * (1 - sy));
      g.scale(1, sy);
      const top = cy - H * .19, bot = cy + H * .08;
      const a1 = oc(seg(t, 4.7, 5.05));
      word(g, 'WE ARE', cx, top, W * .52, H * .17, {
        stroke: a1, lw: 2.5, fill: flick(t, 4.95, R),
        strokeColor: WHITE, strokeAlpha: .7
      });
      const a2 = oc(seg(t, 4.85, 5.4));
      const f = word(g, 'ENDLESS', cx, bot, W * .88, H * .3, {
        stroke: a2, lw: 3, fill: flick(t, 5.25, R),
        echo: { n: 10, phase: (t * .9) % 1, spread: 1.6, alpha: .28 * seg(t, 5.3, 5.8) },
        ghost: { a: .55 * seg(t, 5.4, 5.7), dx: 14, dy: 14 }
      });
      // frame box drawn around lockup
      const bp = io(seg(t, 5.1, 5.9));
      if (bp > 0) {
        const bx = cx - f.w / 2 - 40, byy = top - H * .14, bw = f.w + 80, bh = (bot + f.dsc + 40) - byy + H * .06;
        const per = 2 * (bw + bh);
        g.setLineDash([per * bp, per]);
        g.lineWidth = 2;
        g.strokeStyle = RED;
        g.strokeRect(bx, byy, bw, bh);
        g.setLineDash([]);
        // tick marks on the frame corners
        g.fillStyle = WHITE;
        g.globalAlpha = seg(t, 5.8, 6);
        for (const [x, y] of [[bx, byy], [bx + bw, byy], [bx, byy + bh], [bx + bw, byy + bh]]) g.fillRect(x - 6, y - 6, 12, 12);
        g.globalAlpha = 1;
      }
      g.restore();
    }
  }

  function guides(t, R, gl) {
    // faint grid
    ctx.strokeStyle = 'rgba(227,21,26,.07)';
    ctx.lineWidth = 1;
    const gp = oc(seg(t, 0, 0.8)) * (1 - seg(t, 7.35, 7.6));
    ctx.beginPath();
    for (let x = 0; x <= W; x += 120) { ctx.moveTo(x, H / 2 - H / 2 * gp); ctx.lineTo(x, H / 2 + H / 2 * gp); }
    for (let y = 0; y <= H; y += 120) { ctx.moveTo(W / 2 - W / 2 * gp, y); ctx.lineTo(W / 2 + W / 2 * gp, y); }
    ctx.stroke();

    // centre crosshair draws out from the middle
    const ch = oc(seg(t, .05, .5)) * (1 - seg(t, 7.35, 7.6));
    ctx.strokeStyle = 'rgba(227,21,26,.55)';
    ctx.beginPath();
    ctx.moveTo(W / 2 - W / 2 * ch, H / 2); ctx.lineTo(W / 2 + W / 2 * ch, H / 2);
    ctx.moveTo(W / 2, H / 2 - H / 2 * ch); ctx.lineTo(W / 2, H / 2 + H / 2 * ch);
    ctx.stroke();

    // speed lines sweeping on each word hit
    for (let i = 0; i < 4; i++) {
      const h = [0.3, 1.5, 2.62, 4.7][i];
      const p = seg(t, h, h + .55);
      if (p <= 0 || p >= 1) continue;
      const r = rng(i * 31 + 7);
      for (let k = 0; k < 9; k++) {
        const y = r() * H, len = 300 + r() * 900, sp = .6 + r() * .8;
        const x = (i % 2 ? W - (p * sp * (W + len)) : p * sp * (W + len) - len);
        ctx.fillStyle = k % 3 === 0 ? WHITE : RED;
        ctx.globalAlpha = (1 - p) * (.5 + r() * .5);
        ctx.fillRect(x, y, len, 1 + r() * 3);
      }
      ctx.globalAlpha = 1;
    }

    // glitch bars
    if (gl > .2) {
      const n = Math.floor(gl * 6);
      for (let i = 0; i < n; i++) {
        ctx.fillStyle = R() < .7 ? RED : WHITE;
        ctx.globalAlpha = .25 + R() * .6;
        ctx.fillRect(0, R() * H, W, 2 + R() * 18 * gl);
      }
      ctx.globalAlpha = 1;
    }
  }

  const tc = t => { const f = Math.floor(t * FPS) % FPS, s = Math.floor(t); return `00:00:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`; };

  function hud(t) {
    const a = seg(t, .15, .45) * (1 - seg(t, 7.3, 7.5));
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha = a;
    const m = 64, k = 34;
    ctx.strokeStyle = WHITE; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(m, m + k); ctx.lineTo(m, m); ctx.lineTo(m + k, m);
    ctx.moveTo(W - m - k, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + k);
    ctx.moveTo(m, H - m - k); ctx.lineTo(m, H - m); ctx.lineTo(m + k, H - m);
    ctx.moveTo(W - m - k, H - m); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m, H - m - k);
    ctx.stroke();
    ctx.font = `500 20px ${MONO}`;
    ctx.fillStyle = WHITE;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('ENDLESS / WARSZAWA', m + 52, m + 6);
    ctx.fillText(tc(t), m + 52, H - m - 6);
    ctx.textAlign = 'right';
    ctx.fillText('1920×1080 · 24 FPS', W - m - 52, H - m - 6);
    if (Math.floor(t * 2) % 2 === 0) { ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(W - m - 132, m + 6, 8, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = WHITE;
    ctx.fillText('REC', W - m - 52, m + 6);
    ctx.restore();
  }

  function renderAt(t) {
    t = clamp(t, 0, DUR);
    const R = rng(Math.floor(t * FPS) * 7919 + 13);
    const gl = glitchAmt(t, R);

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // pre-roll flash
    if (t < .12) { ctx.fillStyle = RED; ctx.globalAlpha = 1 - t / .12; ctx.fillRect(0, H / 2 - 2, W, 4); ctx.globalAlpha = 1; }

    guides(t, R, gl);

    scene(lx, t, R);

    // tinted copy for RGB split
    tx.globalCompositeOperation = 'source-over';
    tx.clearRect(0, 0, W, H);
    tx.drawImage(L, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = CYAN;
    tx.fillRect(0, 0, W, H);

    mx.globalCompositeOperation = 'source-over';
    mx.clearRect(0, 0, W, H);
    const split = 3 + gl * 34;
    mx.globalAlpha = .55 + gl * .3;
    mx.drawImage(T, split, -split * .2);
    mx.globalAlpha = 1;
    mx.drawImage(L, 0, 0);

    ctx.drawImage(M, 0, 0);

    // slice displacement
    if (gl > .05) {
      const n = Math.floor(3 + gl * 16);
      for (let i = 0; i < n; i++) {
        const y = R() * H, h = 4 + R() * H * .09 * gl, dx = (R() - .5) * 320 * gl;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, y, W, h);
        ctx.drawImage(M, 0, y, W, h, dx, y, W, h);
        if (R() < .3) { ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(T, 0, y, W, h, -dx * .6, y, W, h); ctx.globalCompositeOperation = 'source-over'; }
      }
    }

    hud(t);

    // TV-off line at the end
    const off = seg(t, 7.45, 7.62), gone = seg(t, 7.62, 7.8);
    if (off > 0 && gone < 1) {
      ctx.fillStyle = WHITE;
      ctx.globalAlpha = 1 - gone;
      const w = W * (1 - io(gone));
      ctx.fillRect(W / 2 - w / 2, H / 2 - 2, w, 4);
      ctx.globalAlpha = 1;
    }
    if (t >= 7.8) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }

    // texture
    ctx.fillStyle = slPat; ctx.fillRect(0, 0, W, H);
    const gr = ctx.createPattern(G, 'repeat');
    ctx.save(); ctx.translate(Math.floor(R() * 256), Math.floor(R() * 256)); ctx.fillStyle = gr; ctx.fillRect(-256, -256, W + 512, H + 512); ctx.restore();
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.75)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  // ---------- player ----------
  const playBtn = document.getElementById('play'), loopBtn = document.getElementById('loop');
  const scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduce, loop = true, t0 = performance.now(), cur = reduce ? 5.9 : 0, raf = 0;

  function show(t) { cur = t; renderAt(t); scrub.value = t; tcEl.textContent = tc(t); }
  function tick(now) {
    if (!playing) return;
    let t = (now - t0) / 1000;
    if (t >= DUR) { if (loop) { t0 = now; t = 0; } else { t = DUR; playing = false; playBtn.textContent = 'Replay'; } }
    show(t);
    raf = requestAnimationFrame(tick);
  }
  function play(from) { playing = true; t0 = performance.now() - from * 1000; playBtn.textContent = 'Pause'; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
  function pause() { playing = false; playBtn.textContent = 'Play'; cancelAnimationFrame(raf); }

  playBtn.addEventListener('click', () => { if (playing) pause(); else play(cur >= DUR ? 0 : cur); });
  loopBtn.addEventListener('click', () => { loop = !loop; loopBtn.setAttribute('aria-pressed', loop); });
  scrub.addEventListener('input', () => { pause(); show(+scrub.value); });

  window.intro = { renderAt, pause, DUR, FPS, canvas: cv };

  document.fonts.load(`100px ${DISPLAY}`).catch(() => {}).then(() => {
    for (const k in cache) delete cache[k];
    if (playing) play(0); else { playBtn.textContent = 'Play'; show(cur); }
  });
})();
</script>
