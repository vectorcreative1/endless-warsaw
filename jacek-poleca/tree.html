<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Poppins', sans-serif;

  color: #111;

h1 { font-size: 20px; font-weight: 800; color: #0D1B4B; margin-bottom: 4px; }
.note { font-size: 11px; color: #0D1B4B; margin-bottom: 20px; line-height: 1.7; opacity: .7; }

/* sticky update bar */
.update-bar {
  position: sticky; top: 0; z-index: 100;
  background: #0D1B4B;
  color: white;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  border-radius: 10px;
  margin-bottom: 24px;
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
}
.update-bar span { font-size: 12px; font-weight: 600; opacity: .8; }
.update-bar .changes { font-size: 11px; color: #F3B702; }
.btn-update {
  background: #F3B702; color: #111;
  border: none; border-radius: 100px;
  font-family: 'Poppins', sans-serif;
  font-size: 12px; font-weight: 800;
  padding: 8px 20px; cursor: pointer;
  transition: background .12s, transform .1s;
}
.btn-update:hover { background: #e0a800; }
.btn-update:active { transform: scale(.97); }
.btn-update.saved { background: #2ecc71; color: white; }

/* category heading */
.cat-title {
  font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: #fff; background: #0D1B4B;
  display: inline-block; padding: 7px 20px; border-radius: 100px;
  margin: 32px 0 12px;
}
table { width: 100%; border-collapse: separate; border-spacing: 0; }
.table-wrap { border-radius: 12px; overflow: hidden; }
thead th {
  font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: #aaa; text-align: left; padding: 0 10px 8px; border-bottom: 1px solid #ddd;
}
tr.main-row td { background: #fff; border-bottom: 1px solid #f0ece7; }
tr.alt-row td  { background: #faf9f7; border-bottom: 1px solid #ece8e2; }
tr.spacer td   { height: 6px; background: transparent; }
tr.subcat-header td { background: transparent; padding: 14px 0 6px; border: none; }
.subcat-pill {
  font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: #0D1B4B; background: #fff; border: none;
  display: inline-block; padding: 3px 12px; border-radius: 100px;
}
td { padding: 9px 10px; vertical-align: middle; }

.path { font-size: 11px; color: #555; line-height: 1.5; }
.path b { color: #111; }
.path .sep { color: #ccc; margin: 0 3px; }

.badge-main { background: #F3B702; color: #111; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 100px; white-space: nowrap; }
.badge-alt  { background: #eee; color: #777; font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 100px; white-space: nowrap; }

.title-field {
  font-size: 12px; font-weight: 700;
  border: none; outline: none; background: transparent;
  width: 100%; cursor: text;
  border-bottom: 1.5px dashed transparent;
  padding: 2px 0; transition: border-color .15s;
}
.title-field:focus, .title-field:hover { border-bottom-color: #F3B702; }

.url-wrap { display: flex; align-items: center; gap: 6px; }
.url-field {
  font-size: 10px; color: #888;
  border: none; outline: none; background: transparent;
  width: 100%; border-bottom: 1.5px dashed transparent;
  padding: 2px 0; cursor: text; transition: border-color .15s;
}
.url-field:focus, .url-field:hover { border-bottom-color: #ccc; color: #333; }
.url-field.loading { color: #bbb; font-style: italic; }
.open-link { font-size: 13px; text-decoration: none; opacity: .35; transition: opacity .15s; flex-shrink: 0; }
.open-link:hover { opacity: 1; }

.poster-wrap { width: 40px; height: 60px; flex-shrink: 0; border-radius: 4px; overflow: hidden; background: #eee; position: relative; }
.poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.poster-empty { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #bbb; }

/* changed row highlight */
tr.changed td { background: #fffbee !important; }
</style>

    { key:"r_doc_science",     path:["Dokument","Nauka / technologia"],     main:{title:"Our Universe",       url:"https://www.imdb.com/title/tt9253866/"}, alt:{title:"High Score",                  url:"https://www.imdb.com/title/tt9770150/"} },
    { key:"r_doc_music",       path:["Dokument","Muzyczny"],                main:{title:"Get Back",           url:"https://www.imdb.com/title/tt8579674/"}, alt:{title:"Amy",                         url:"https://www.imdb.com/title/tt2870648/"} },

// Track changes vs. defaults
const defaults = {}; // key → {main:{title,url}, alt:{title,url}}
const current  = {}; // same structure, updated on edit
DATA.forEach(sec => sec.rows.forEach(row => {
  defaults[row.key] = { main:{...row.main}, alt:{...row.alt} };
  current[row.key]  = { main:{...row.main}, alt:{...row.alt} };
}));

function countChanges() {
  let n = 0;
  Object.keys(defaults).forEach(k => {
    ['main','alt'].forEach(t => {
      if (current[k][t].title !== defaults[k][t].title || current[k][t].url !== defaults[k][t].url) n++;
    });
  });
  return n;
}

function updateChangesBadge() {
  const n = countChanges();
  const el = document.getElementById('changes-count');
  el.textContent = n === 0 ? 'brak zmian' : `${n} zmian${n === 1 ? 'a' : n < 5 ? 'y' : ''} – kliknij Aktualizuj`;
}

function saveChanges() {
  const overrides = {};
  Object.keys(defaults).forEach(k => {
    const entry = {};
    ['main','alt'].forEach(t => {
      if (current[k][t].title !== defaults[k][t].title || current[k][t].url !== defaults[k][t].url) {
        entry[t] = { title: current[k][t].title, url: current[k][t].url };
      }
    });
    if (Object.keys(entry).length) overrides[k] = entry;
  });
  localStorage.setItem('jacek_tree_overrides', JSON.stringify(overrides));
  const btn = document.querySelector('.btn-update');
  btn.textContent = 'Zapisano!';
  btn.classList.add('saved');
  setTimeout(() => { btn.textContent = 'Aktualizuj stronę główną'; btn.classList.remove('saved'); }, 2000);
}

// TMDB helpers
function imdbId(url) { const m = url && url.match(/title\/(tt\d+)/); return m ? m[1] : null; }

async function fetchPoster(url) {
  const id = imdbId(url);
  if (!id) return null;
  try {
    const r = await fetch(`https://api.themoviedb.org/3/find/${id}?api_key=${TMDB_KEY}&external_source=imdb_id`);
    const d = await r.json();
    const item = d.movie_results?.[0] || d.tv_results?.[0];
    return item?.poster_path ? `https://image.tmdb.org/t/p/w154${item.poster_path}` : null;
  } catch { return null; }
}

async function searchTitle(title) {
  const q = encodeURIComponent(title);
  try {
    const [mv, tv] = await Promise.all([
      fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${q}`).then(r=>r.json()),
      fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&query=${q}`).then(r=>r.json()),
    ]);
    const all = [...(mv.results||[]).map(x=>({...x,type:'movie'})), ...(tv.results||[]).map(x=>({...x,type:'tv'}))].filter(x=>x.poster_path);
    if (!all.length) return null;
    const best = all[0];
    const ext = await fetch(`https://api.themoviedb.org/3/${best.type}/${best.id}/external_ids?api_key=${TMDB_KEY}`).then(r=>r.json());
    return { posterUrl: `https://image.tmdb.org/t/p/w154${best.poster_path}`, imdbUrl: ext.imdb_id ? `https://www.imdb.com/title/${ext.imdb_id}/` : null };
  } catch { return null; }
}

function setPoster(wrap, url) {
  wrap.innerHTML = '<div class="poster-empty">...</div>';
  fetchPoster(url).then(p => {
    if (p) { const img=document.createElement('img'); img.src=p; wrap.innerHTML=''; wrap.appendChild(img); }
    else wrap.innerHTML = '<div class="poster-empty">—</div>';
  });
}

function makeRow(rowData, isMain, key, path) {
  const tr = document.createElement('tr');
  tr.className = isMain ? 'main-row' : 'alt-row';
  tr.dataset.key = key;
  tr.dataset.type = isMain ? 'main' : 'alt';

  const type = isMain ? 'main' : 'alt';

  // path
  const pathTd = document.createElement('td');
  if (isMain) {
    pathTd.className = 'path';
    // When a subcat header exists, show only path[2+]; otherwise show full path
    const displayPath = path.length > 2 ? path.slice(2) : (path.length === 2 ? [path[1]] : path);
    pathTd.innerHTML = displayPath.map((s,i) => i===0 ? `<b>${s}</b>` : `<span class="sep">›</span>${s}`).join('');
  }
  tr.appendChild(pathTd);

  // badge
  const badgeTd = document.createElement('td');
  const badge = document.createElement('span');
  badge.className = isMain ? 'badge-main' : 'badge-alt';
  badge.textContent = isMain ? 'główna' : 'alternatywa';
  badgeTd.appendChild(badge);
  tr.appendChild(badgeTd);

  // title
  const titleTd = document.createElement('td');
  const titleInput = document.createElement('input');
  titleInput.className = 'title-field';
  titleInput.type = 'text';
  titleInput.value = rowData.title;
  titleTd.appendChild(titleInput);
  tr.appendChild(titleTd);

  // url
  const urlTd = document.createElement('td');
  const urlWrap = document.createElement('div');
  urlWrap.className = 'url-wrap';
  const urlInput = document.createElement('input');
  urlInput.className = 'url-field';
  urlInput.type = 'text';
  urlInput.value = rowData.url;
  urlInput.placeholder = 'wklej link lub zostaw puste';
  const link = document.createElement('a');
  link.className = 'open-link';
  link.textContent = '↗';
  link.target = '_blank';
  link.href = rowData.url;
  urlWrap.appendChild(urlInput);
  urlWrap.appendChild(link);
  urlTd.appendChild(urlWrap);
  tr.appendChild(urlTd);

  // poster
  const posterTd = document.createElement('td');
  const wrap = document.createElement('div');
  wrap.className = 'poster-wrap';
  posterTd.appendChild(wrap);
  tr.appendChild(posterTd);
  setPoster(wrap, rowData.url);

  function markChanged() {
    const isChanged = current[key][type].title !== defaults[key][type].title || current[key][type].url !== defaults[key][type].url;
    tr.classList.toggle('changed', isChanged);
    updateChangesBadge();
  }

  // url change
  urlInput.addEventListener('change', () => {
    const url = urlInput.value.trim();
    link.href = url || '#';
    current[key][type].url = url;
    setPoster(wrap, url);
    if (!titleInput.value.trim() && url) {
      const id = imdbId(url);
      if (id) {
        fetch(`https://api.themoviedb.org/3/find/${id}?api_key=${TMDB_KEY}&external_source=imdb_id`)
          .then(r=>r.json()).then(d => {
            const item = d.movie_results?.[0] || d.tv_results?.[0];
            if (item) { titleInput.value = item.title||item.name||''; current[key][type].title = titleInput.value; markChanged(); }
          });
      }
    }
    markChanged();
  });

  // title change → search
  let timer;
  titleInput.addEventListener('input', () => {
    current[key][type].title = titleInput.value;
    markChanged();
    clearTimeout(timer);
    if (!titleInput.value.trim() || urlInput.value.trim()) return;
    timer = setTimeout(async () => {
      urlInput.className = 'url-field loading';
      urlInput.value = 'szukam...';
      const res = await searchTitle(titleInput.value);
      if (res) {
        urlInput.value = res.imdbUrl || '';
        current[key][type].url = urlInput.value;
        link.href = urlInput.value || '#';
        const img = document.createElement('img'); img.src = res.posterUrl;
        wrap.innerHTML = ''; wrap.appendChild(img);
      } else { urlInput.value = ''; current[key][type].url = ''; }
      urlInput.className = 'url-field';
      markChanged();
    }, 900);
  });

  return tr;
}

const root = document.getElementById('root');

DATA.forEach(section => {
  const catTitle = document.createElement('div');
  catTitle.className = 'cat-title';
  catTitle.textContent = section.cat;
  root.appendChild(catTitle);

  const table = document.createElement('table');
  const tbody = document.createElement('tbody');

  let lastSubcat = null;
  section.rows.forEach((row, i) => {
    const subcat = row.path[1] || null;
    if (subcat && subcat !== lastSubcat) {
      if (lastSubcat !== null) {
        const spacer = document.createElement('tr');
        spacer.className = 'spacer';
        spacer.innerHTML = '<td colspan="5"></td>';
        tbody.appendChild(spacer);
      }
      const subRow = document.createElement('tr');
      subRow.className = 'subcat-header';
      subRow.innerHTML = `<td colspan="5"><span class="subcat-pill">${subcat}</span></td>`;
      tbody.appendChild(subRow);
      lastSubcat = subcat;
    }
    tbody.appendChild(makeRow(row.main, true,  row.key, row.path));
    tbody.appendChild(makeRow(row.alt,  false, row.key, row.path));
  });

  table.appendChild(tbody);
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  wrap.appendChild(table);
  root.appendChild(wrap);
});
</script>
</body>
</html>
