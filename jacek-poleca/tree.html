<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacek poleca – drzewo decyzyjne</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --yellow: #F3B702;
  --navy:   #0D1B4B;
  --red:    #6b0a1a;
  --white:  #fff;
  --gray:   #f4f4f6;
  --line:   #ddd;
}
body {
  font-family: 'Poppins', sans-serif;
  background: #f0ede8;
  color: #111;
  padding: 40px 20px 80px;
}
h1 {
  font-size: 22px; font-weight: 800;
  color: var(--red);
  margin-bottom: 4px;
}
.subtitle {
  font-size: 13px; color: #666;
  margin-bottom: 32px;
}

/* ── TREE LAYOUT ── */
.tree { display: flex; flex-direction: column; gap: 48px; }

.section { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
.section-title {
  font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: #999; margin-bottom: 16px;
}

/* question node */
.q-node {
  background: var(--navy);
  color: white;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 13px; font-weight: 600;
  display: inline-block;
  margin-bottom: 12px;
}

/* branch row */
.branch { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
.branch-item { flex: 1 1 160px; }

/* choice chip */
.choice {
  background: var(--gray);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 8px;
  cursor: default;
}
.choice .ic { font-size: 16px; }

/* arrow */
.arrow {
  text-align: center; font-size: 18px; color: #bbb; margin: 2px 0 4px;
}

/* result card */
.result-card {
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid var(--yellow);
  background: white;
  font-size: 12px;
}
.result-card.alt {
  border-color: #ddd;
  opacity: .85;
}
.result-poster {
  width: 100%; aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: #eee;
}
.result-poster-fallback {
  width: 100%; aspect-ratio: 2/3;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; background: #f4f4f4;
}
.result-body { padding: 10px; }
.result-title { font-weight: 800; font-size: 13px; line-height: 1.2; margin-bottom: 2px; }
.result-orig { font-size: 10px; color: #888; margin-bottom: 6px; }
.result-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
.result-tag {
  background: var(--yellow); border-radius: 100px;
  padding: 2px 7px; font-size: 9px; font-weight: 700;
}
.result-card.alt .result-tag { background: #eee; color: #555; }
.result-badge {
  display: inline-block;
  background: var(--navy); color: white;
  border-radius: 100px; padding: 2px 8px;
  font-size: 9px; font-weight: 700;
}
.result-desc { font-size: 11px; color: #333; margin-bottom: 6px; line-height: 1.4; }

.label-primary {
  font-size: 9px; font-weight: 700; color: var(--red); letter-spacing: .05em;
  text-transform: uppercase; margin-bottom: 4px;
}
.label-alt {
  font-size: 9px; font-weight: 700; color: #aaa; letter-spacing: .05em;
  text-transform: uppercase; margin-bottom: 4px;
}

.path-label {
  font-size: 10px; color: #888; font-weight: 600; margin: 6px 0 4px;
}
</style>
</head>
<body>

async function fetchPoster(imdbId) {
  try {
    const r = await fetch(`https://api.themoviedb.org/3/find/${imdbId}?api_key=${TMDB_KEY}&external_source=imdb_id`);
    const d = await r.json();
    const item = d.movie_results?.[0] || d.tv_results?.[0];
    return item?.poster_path ? `https://image.tmdb.org/t/p/w300${item.poster_path}` : null;
  } catch { return null; }
}

function makeCard(r, isPrimary) {
  const wrap = document.createElement('div');
  const label = document.createElement('div');
  label.className = isPrimary ? 'label-primary' : 'label-alt';
  label.textContent = isPrimary ? '★ główna rekomendacja' : '↩ alternatywa ("już widziałem")';
  wrap.appendChild(label);

  const card = document.createElement('div');
  card.className = 'result-card' + (isPrimary ? '' : ' alt');

  const posterArea = document.createElement('div');
  posterArea.className = 'result-poster-fallback';
  posterArea.textContent = r.emoji;
  card.appendChild(posterArea);

  const body = document.createElement('div');
  body.className = 'result-body';
  body.innerHTML = `
    <div class="result-title">${r.title}</div>
    <div class="result-orig">${r.orig}</div>
    <div class="result-tags">${r.tags.map(t=>`<span class="result-tag">${t}</span>`).join('')}</div>
    <div class="result-desc">${r.desc}</div>
    <span class="result-badge">${r.badge}</span>
  `;
  card.appendChild(body);
  wrap.appendChild(card);

  fetchPoster(r.imdbId).then(url => {
    if (url) {
      const img = document.createElement('img');
      img.className = 'result-poster';
      img.src = url; img.alt = r.title;
      posterArea.className = '';
      posterArea.innerHTML = '';
      posterArea.appendChild(img);
    }
  });

  return wrap;
}

const tree = document.getElementById('tree');

SECTIONS.forEach(section => {
  const sec = document.createElement('div');
  sec.className = 'section';

  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = section.title;
  sec.appendChild(title);

  section.paths.forEach((path, i) => {
    if (i > 0) {
      const divider = document.createElement('hr');
      divider.style.cssText = 'border:none;border-top:1px solid #eee;margin:20px 0';
      sec.appendChild(divider);
    }

    // path label
    const pathLabel = document.createElement('div');
    pathLabel.className = 'path-label';
    pathLabel.textContent = '→ ' + path.choices.join(' → ');
    sec.appendChild(pathLabel);

    // cards row
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;';

    const primary = makeCard(path.result, true);
    primary.style.flex = '1 1 140px';
    row.appendChild(primary);

    const altCard = makeCard(path.alt, false);
    altCard.style.flex = '1 1 140px';
    row.appendChild(altCard);

    sec.appendChild(row);
  });

  tree.appendChild(sec);
});
</script>
