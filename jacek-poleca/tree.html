<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacek poleca – drzewo decyzyjne</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Poppins', sans-serif;
  background: #f5f3ef;
  color: #111;
  padding: 40px 24px 80px;
  max-width: 900px;
  margin: 0 auto;
}
h1 { font-size: 20px; font-weight: 800; color: #6b0a1a; margin-bottom: 4px; }
.subtitle { font-size: 12px; color: #888; margin-bottom: 36px; }

/* ── CATEGORY BLOCK ── */
.cat { margin-bottom: 48px; }
.cat-title {
  font-size: 13px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: #fff;
  background: #0D1B4B;
  display: inline-block;
  padding: 5px 14px; border-radius: 100px;
  margin-bottom: 20px;
}

/* ── PATH ROW ── */
.path { display: flex; align-items: center; flex-wrap: wrap; gap: 0; margin-bottom: 14px; }

/* breadcrumb steps */
.step {
  display: flex; align-items: center;
}
.step-bubble {
  background: #fff;
  border: 1.5px solid #ddd;
  border-radius: 8px;
  padding: 6px 11px;
  font-size: 11px; font-weight: 600;
  white-space: nowrap;
  color: #333;
}
.step-arrow {
  color: #ccc; font-size: 14px; padding: 0 4px;
  flex-shrink: 0;
}

/* result pill */
.result {
  display: flex; align-items: center; gap: 6px;
  background: #F3B702;
  border-radius: 8px;
  padding: 6px 11px;
  font-size: 11px; font-weight: 700;
  white-space: nowrap;
  text-decoration: none; color: #111;
  transition: background .12s;
}
.result:hover { background: #e0a800; }
.result .ic { font-size: 14px; }

.alt-row {
  display: flex; align-items: center; gap: 0;
  margin-bottom: 6px; padding-left: 20px;
}
.alt-line {
  width: 16px; height: 20px;
  border-left: 1.5px dashed #ccc;
  border-bottom: 1.5px dashed #ccc;
  margin-right: 6px;
  flex-shrink: 0;
}
.result.alt {
  background: #f0ede8;
  border: 1.5px dashed #ccc;
  color: #555;
  font-weight: 600;
}
.result.alt:hover { background: #e8e4df; }
.alt-label {
  font-size: 9px; color: #aaa; font-weight: 600;
  letter-spacing: .05em; margin-right: 4px;
  white-space: nowrap;
}

.block { margin-bottom: 20px; }
.divider { border: none; border-top: 1px solid #e8e4e0; margin: 16px 0; }
</style>
</head>
<body>

<h1>🎬 Jacek poleca – drzewo decyzyjne</h1>
<p class="subtitle">Wszystkie ścieżki i rekomendacje. Żółte = główna rekomendacja · Szare = alternatywa po "już to widziałem/am"<br>
<strong style="color:#6b0a1a">✏️ Nazwy filmów można edytować bezpośrednio — kliknij i wpisz swój wybór.</strong></p>

<div id="root"></div>

<script>
const SECTIONS = [
  {
    title: "🎬 Film",
    paths: [
      {
        steps: ["Film", "Napięcie i thriller", "Psychologia i twist"],
        result: { ic:"🔪", title:"Zaginiona dziewczyna", url:"https://www.imdb.com/title/tt2267998/" },
        alt:    { ic:"🕶️", title:"Incepcja", url:"https://www.imdb.com/title/tt1375666/" }
      },
      {
        steps: ["Film", "Napięcie i thriller", "Akcja, szybko, głośno"],
        result: { ic:"💥", title:"Extraction", url:"https://www.imdb.com/title/tt8936646/" },
        alt:    { ic:"🔫", title:"Tenet", url:"https://www.imdb.com/title/tt6723592/" }
      },
      {
        steps: ["Film", "Sci-Fi"],
        result: { ic:"🪐", title:"Diuna", url:"https://www.imdb.com/title/tt1160419/" },
        alt:    { ic:"🛸", title:"Nowy początek (Arrival)", url:"https://www.imdb.com/title/tt2543164/" }
      },
      {
        steps: ["Film", "Komedia – romantyczna"],
        result: { ic:"💕", title:"Szalone, bogate Azjatki", url:"https://www.imdb.com/title/tt3104988/" },
        alt:    { ic:"💐", title:"To All the Boys: zawsze i na zawsze", url:"https://www.imdb.com/title/tt10954600/" }
      },
      {
        steps: ["Film", "Komedia – czarny humor / absurd"],
        result: { ic:"🏠", title:"Parasite", url:"https://www.imdb.com/title/tt6751668/" },
        alt:    { ic:"🎬", title:"La La Land", url:"https://www.imdb.com/title/tt3783958/" }
      },
      {
        steps: ["Film", "Coś, o czym będę myśleć", "Oparta na faktach"],
        result: { ic:"💣", title:"Oppenheimer", url:"https://www.imdb.com/title/tt15398776/" },
        alt:    { ic:"🚀", title:"Interstellar", url:"https://www.imdb.com/title/tt0816692/" }
      },
      {
        steps: ["Film", "Coś, o czym będę myśleć", "Kino artystyczne"],
        result: { ic:"🤠", title:"Psie pazury", url:"https://www.imdb.com/title/tt10293406/" },
        alt:    { ic:"🎭", title:"Zielona księga", url:"https://www.imdb.com/title/tt1353056/" }
      },
    ]
  },
  {
    title: "📺 Serial",
    paths: [
      {
        steps: ["Serial", "Maraton", "Napięcie i suspens"],
        result: { ic:"👔", title:"Sukcesja", url:"https://www.imdb.com/title/tt7660850/" },
        alt:    { ic:"🏦", title:"Better Call Saul", url:"https://www.imdb.com/title/tt3032476/" }
      },
      {
        steps: ["Serial", "Maraton", "Sci-fi / fantasy"],
        result: { ic:"🧠", title:"Severance", url:"https://www.imdb.com/title/tt11280740/" },
        alt:    { ic:"🌀", title:"Dark", url:"https://www.imdb.com/title/tt5753856/" }
      },
      {
        steps: ["Serial", "Maraton", "Dramat obyczajowy"],
        result: { ic:"🌺", title:"The White Lotus", url:"https://www.imdb.com/title/tt13406094/" },
        alt:    { ic:"🔍", title:"The Undoing", url:"https://www.imdb.com/title/tt8134470/" }
      },
      {
        steps: ["Serial", "Odcinek wieczór", "Komedia"],
        result: { ic:"⚽", title:"Ted Lasso", url:"https://www.imdb.com/title/tt10986410/" },
        alt:    { ic:"🌻", title:"Schitt's Creek", url:"https://www.imdb.com/title/tt8579674/" }
      },
      {
        steps: ["Serial", "Odcinek wieczór", "Ciepły, obyczajowy"],
        result: { ic:"🗼", title:"Emily w Paryżu", url:"https://www.imdb.com/title/tt8962124/" },
        alt:    { ic:"👗", title:"Ginny i Georgia", url:"https://www.imdb.com/title/tt5687612/" }
      },
    ]
  },
  {
    title: "🎙️ Program / Show",
    paths: [
      {
        steps: ["Program", "Stand-up / kabaret"],
        result: { ic:"🎤", title:"Bo Burnham: Inside", url:"https://www.imdb.com/title/tt14544192/" },
        alt:    { ic:"😂", title:"Hannah Gadsby: Nanette", url:"https://www.imdb.com/title/tt6986718/" }
      },
      {
        steps: ["Program", "Teleturniej / talent show"],
        result: { ic:"🎭", title:"RuPaul's Drag Race", url:"https://www.imdb.com/title/tt1353056/" },
        alt:    { ic:"🏆", title:"America's Got Talent", url:"https://www.imdb.com/title/tt0759364/" }
      },
      {
        steps: ["Program", "Lifestyle / kulinaria"],
        result: { ic:"🍳", title:"Chef's Table", url:"https://www.imdb.com/title/tt4295140/" },
        alt:    { ic:"🌮", title:"Ugly Delicious", url:"https://www.imdb.com/title/tt7907916/" }
      },
    ]
  },
  {
    title: "🎞️ Dokument",
    paths: [
      {
        steps: ["Dokument", "Kryminał / true crime"],
        result: { ic:"🔍", title:"Making a Murderer", url:"https://www.imdb.com/title/tt5189670/" },
        alt:    { ic:"🩸", title:"The Jinx", url:"https://www.imdb.com/title/tt3270538/" }
      },
      {
        steps: ["Dokument", "Przyroda i natura"],
        result: { ic:"🌍", title:"Nasz Planet (Our Planet)", url:"https://www.imdb.com/title/tt9253866/" },
        alt:    { ic:"🐋", title:"Nasz Ocean (Our Ocean)", url:"https://www.imdb.com/title/tt9813792/" }
      },
      {
        steps: ["Dokument", "Społeczny / polityczny"],
        result: { ic:"🌐", title:"Dylemat społeczny", url:"https://www.imdb.com/title/tt11464826/" },
        alt:    { ic:"🧬", title:"The Act of Killing", url:"https://www.imdb.com/title/tt2375605/" }
      },
    ]
  }
];

const root = document.getElementById('root');

SECTIONS.forEach(section => {
  const cat = document.createElement('div');
  cat.className = 'cat';

  const title = document.createElement('div');
  title.className = 'cat-title';
  title.textContent = section.title;
  cat.appendChild(title);

  section.paths.forEach((path, i) => {
    const block = document.createElement('div');
    block.className = 'block';

    // main path row
    const pathRow = document.createElement('div');
    pathRow.className = 'path';

    path.steps.forEach((step, si) => {
      const stepEl = document.createElement('div');
      stepEl.className = 'step';
      const bubble = document.createElement('div');
      bubble.className = 'step-bubble';
      bubble.textContent = step;
      stepEl.appendChild(bubble);
      pathRow.appendChild(stepEl);

      const arrow = document.createElement('span');
      arrow.className = 'step-arrow';
      arrow.textContent = '→';
      pathRow.appendChild(arrow);
    });

    const resultLink = document.createElement('a');
    resultLink.className = 'result';
    resultLink.href = path.result.url;
    resultLink.target = '_blank';
    resultLink.innerHTML = `<span class="ic">${path.result.ic}</span> <span contenteditable="true" onclick="event.preventDefault()" style="outline:none;min-width:40px;display:inline-block">${path.result.title}</span>`;
    pathRow.appendChild(resultLink);

    block.appendChild(pathRow);

    // alt row
    const altRow = document.createElement('div');
    altRow.className = 'alt-row';
    const altLine = document.createElement('div');
    altLine.className = 'alt-line';
    altRow.appendChild(altLine);
    const altLabel = document.createElement('span');
    altLabel.className = 'alt-label';
    altLabel.textContent = 'już widziałem →';
    altRow.appendChild(altLabel);
    const altLink = document.createElement('a');
    altLink.className = 'result alt';
    altLink.href = path.alt.url;
    altLink.target = '_blank';
    altLink.innerHTML = `<span class="ic">${path.alt.ic}</span> <span contenteditable="true" onclick="event.preventDefault()" style="outline:none;min-width:40px;display:inline-block">${path.alt.title}</span>`;
    altRow.appendChild(altLink);
    block.appendChild(altRow);

    if (i < section.paths.length - 1) {
      const div = document.createElement('hr');
      div.className = 'divider';
      block.appendChild(div);
    }

    cat.appendChild(block);
  });

  root.appendChild(cat);
});
</script>
</body>
</html>
