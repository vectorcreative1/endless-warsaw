<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jacek poleca – Vectra Screen Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --yellow: #F3B702;
  --navy:   #0D1B4B;
  --black:  #0A0A0A;
  --white:  #FFFFFF;
  --bubble-j: #FFFFFF;
  --bubble-u: #0D1B4B;
}

html {
  min-height: 100%;
  background: #6b0a1a;
  overflow-y: auto;
}
#bg-hero {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
#bg-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: left center;
  display: block;
}
body {
  min-height: 100dvh;
  font-family: 'Poppins', sans-serif;
  background: transparent;
  position: relative;
  z-index: 1;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

#app {
  position: fixed;
  right: 12%;
  top: 50%;
  transform: translateY(-50%);
  max-height: 90dvh;
  overflow-y: auto;
  scrollbar-width: none;
  padding-bottom: 24px;
}

/* when viewport too narrow — hide desktop hero, show portrait */
#bg-mobile {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 0;
  pointer-events: none;
}
#bg-mobile img {
  width: 100%;
  height: auto;
  display: block;
  transition: filter .5s ease;
}
body.chat-active #bg-mobile img {
  filter: brightness(0.25);
}

@media (max-width: 900px) {
  #bg-hero   { display: none; }
  #bg-mobile { display: block; }

  /* INTRO: push to bottom of screen */
  body {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: stretch;
    padding: 0 0 40px 0;
    background: transparent;
    min-height: 100dvh;
  }
  #app {
    position: static;
    transform: none;
    max-height: none;
    overflow-y: visible;
    padding: 0 16px 36px;
    background: linear-gradient(to top, rgba(107,10,26,.85) 60%, transparent 100%);
  }

  /* CHAT: fill screen with semi-opaque backdrop */
  body.chat-active {
    justify-content: flex-start;
    padding: 0;
    background: rgba(107,10,26,.88);
    height: 100dvh;
    overflow-y: auto;
  }
  body.chat-active #app {
    padding: 100px 16px 100px;
    width: 100%;
  }
  body.chat-active #restart {
    padding: 14px 0 0 0;
    position: sticky;
    bottom: 20px;
    z-index: 10;
  }
}

/* ── APP SHELL ───────────────────────────────── */
#app {
  width: 440px;
  max-width: 100%;
  display: flex;
  flex-direction: column;
}

#app::-webkit-scrollbar { display: none; }

/* ── CHAT WRAP ───────────────────────────────── */
#chat-wrap {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.av {
  width: 46px; height: 46px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--yellow);
}
.av img { width: 100%; height: 100%; object-fit: cover; }

.head-info { flex: 1; min-width: 0; }
.head-name  { font-size: 15px; font-weight: 700; color: var(--black); }
.head-sub   { font-size: 11px; color: #22a85a; font-weight: 600; }

.head-badge {
  background: var(--yellow);
  color: var(--black);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 100px;
  white-space: nowrap;
}

/* ── INTRO ───────────────────────────────────── */
#intro-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0;
  width: 100%;
}

#intro-area {
  width: 100%;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
}


.intro-row {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  animation: floatIn .5s .1s cubic-bezier(.34,1.4,.64,1) both;
}

.intro-av-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}

.intro-av {
  width: 64px; height: 64px;
  border-radius: 50%;
  overflow: hidden;
}
.intro-av img { width: 100%; height: 100%; object-fit: cover; }

.intro-av-name {
  font-size: 12px;
  font-weight: 800;
  color: var(--white);
  text-align: center;
  line-height: 1.25;
  letter-spacing: 0.01em;
}

.intro-bubble {
  background: var(--white);
  color: var(--black);
  font-size: 17px;
  font-weight: 700;
  line-height: 1.5;
  padding: 18px 24px;
  border-radius: 22px;
  border-top-left-radius: 4px;
  text-align: left;
  box-shadow: 0 4px 24px rgba(0,0,0,.12);
}

@keyframes floatIn {
  from { opacity: 0; transform: translateY(-14px) scale(.93); }
  to   { opacity: 1; transform: none; }
}

/* ── MESSAGES ────────────────────────────────── */
#msgs {
  padding: 0 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow: visible;
  scroll-behavior: smooth;

}

/* Jacek row: avatar + bubble */
.msg-j {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  animation: msgInLeft .38s cubic-bezier(.34,1.5,.64,1) both;
}
.msg-j-av {
  width: 38px; height: 38px;
  border-radius: 50%; overflow: hidden; flex-shrink: 0;
  margin-top: 2px;
}
.msg-j-av img { width:100%; height:100%; object-fit:cover; }

/* user bubble right */
.msg-u {
  display: flex;
  justify-content: flex-end;
  animation: msgInRight .32s cubic-bezier(.34,1.5,.64,1) both;
}

/* entrance animations */
.msg-j { animation: msgInLeft .38s cubic-bezier(.34,1.5,.64,1) both; }
.msg-u { animation: msgInRight .32s cubic-bezier(.34,1.5,.64,1) both; }

@keyframes msgInLeft {
  from { opacity: 0; transform: translateX(-22px) scale(.9) rotate(-1.5deg); }
  to   { opacity: 1; transform: none; }
}
@keyframes msgInRight {
  from { opacity: 0; transform: translateX(22px) scale(.9) rotate(1.5deg); }
  to   { opacity: 1; transform: none; }
}

.bubble {
  max-width: 82%;
  padding: 18px 24px;
  border-radius: 22px;
  font-size: 17px;
  line-height: 1.5;
  font-weight: 700;
}

.msg-j .bubble, .msg-j > .bubble {
  background: var(--bubble-j);
  color: var(--black);
  border-top-left-radius: 4px;
  box-shadow: 0 2px 10px rgba(0,0,0,.09);
}

.msg-u .bubble, .msg-u > .bubble {
  background: var(--bubble-u);
  color: var(--white);
  border-bottom-right-radius: 4px;
  box-shadow: 0 2px 10px rgba(0,0,0,.15);
}

.bubble strong { font-weight: 800; }

/* typing */
.typing {
  display: inline-flex; gap: 5px; align-items: center;
  background: var(--bubble-j);
  border-radius: 18px; border-bottom-left-radius: 4px;
  padding: 13px 18px;
  box-shadow: 0 1px 6px rgba(0,0,0,.07);
  animation: slideInLeft .25s ease both;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: #bbb; animation: bounce 1.1s infinite ease-in-out; }
.dot:nth-child(2) { animation-delay: .18s; }
.dot:nth-child(3) { animation-delay: .36s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

/* result card */
.result-card {
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  max-width: 88%;
  box-shadow: 0 4px 20px rgba(0,0,0,.13);
  animation: cardIn .5s cubic-bezier(.34,1.4,.64,1) both;
}
@keyframes cardIn {
  from { opacity:0; transform: translateY(20px) scale(.88) rotateX(8deg); }
  to   { opacity:1; transform: none; }
}
.rc-poster {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 16px 16px 0 0;
}
.rc-poster-fallback {
  width: 100%; height: 130px;
  display: flex; align-items: center; justify-content: center;
  font-size: 60px;
  background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
}
.rc-body   { padding: 14px 16px 16px; }
.rc-title  { font-size: 18px; font-weight: 900; line-height:1.2; margin-bottom:3px; }
.rc-orig   { font-size: 12px; color:#999; margin-bottom:10px; }
.rc-tags   { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:11px; }
.rc-tag    { background:var(--yellow); color:var(--black); font-size:10px; font-weight:800; padding:3px 9px; border-radius:100px; }
.rc-desc   { font-size:13px; line-height:1.6; color:#333; margin-bottom:13px; }
.rc-where  { font-size:12px; font-weight:700; color:#666; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.rc-where-badge { background:var(--navy); color:var(--white); padding:3px 10px; border-radius:100px; font-size:11px; font-weight:700; }

/* ── CHOICES ─────────────────────────────────── */
#choices {
  padding: 14px 0 0 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

/* intro choices — buttons float on yellow */
#intro-choices {
  padding: 20px 0 0 78px;
  display: flex;
  flex-direction: row;
  justify-content: flex-start;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
  animation: floatIn .5s .3s cubic-bezier(.34,1.3,.64,1) both;
}

.ch {
  background: var(--navy);
  border: none;
  border-radius: 20px;
  border-bottom-right-radius: 4px;
  font-family: 'Poppins', sans-serif;
  font-size: 15px;
  font-weight: 800;
  padding: 14px 28px;
  cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  color: var(--white);
  transition: background .14s, transform .12s, box-shadow .12s;
  box-shadow: 0 2px 10px rgba(13,27,75,.25);
  animation: choiceIn .35s cubic-bezier(.34,1.5,.64,1) both;
}
.ch:nth-child(1) { animation-delay: .0s; }
.ch:nth-child(2) { animation-delay: .06s; }
.ch:nth-child(3) { animation-delay: .12s; }
.ch:nth-child(4) { animation-delay: .18s; }
@keyframes choiceIn {
  from { opacity:0; transform: translateY(12px) scale(.94); }
  to   { opacity:1; transform: none; }
}
@keyframes choiceFlyOut {
  from { opacity:1; transform: translateX(0) scale(1); }
  to   { opacity:0; transform: translateX(80px) scale(.88); }
}
.ch.flying { animation: choiceFlyOut .22s cubic-bezier(.4,0,1,1) both; pointer-events:none; }
.ch:hover  { background: #1a2d6e; transform: translateY(-1px); box-shadow: 0 5px 16px rgba(13,27,75,.35); }
.ch:active { transform: scale(.97); }
.ch-ic     { font-size: 18px; flex-shrink:0; }

/* intro big buttons — identical to .ch */
.ch-big {
  background: var(--navy);
  border: none;
  border-radius: 20px;
  border-bottom-right-radius: 4px;
  font-family: 'Poppins', sans-serif;
  font-size: 15px;
  font-weight: 800;
  padding: 14px 28px;
  cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  color: var(--white);
  transition: background .14s, transform .12s, box-shadow .12s;
  box-shadow: 0 2px 10px rgba(13,27,75,.25);
}
.ch-big:hover  { background: #1a2d6e; transform: translateY(-1px); box-shadow: 0 5px 16px rgba(13,27,75,.35); }
.ch-big:active { transform: scale(.97); }

/* flying clone for intro button → chat bubble transition */
.btn-fly-clone {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  background: var(--navy);
  border-radius: 20px;
  border-bottom-right-radius: 4px;
  font-family: 'Poppins', sans-serif;
  font-size: 15px;
  font-weight: 800;
  padding: 14px 28px;
  color: var(--white);
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 2px 10px rgba(13,27,75,.25);
  white-space: nowrap;
  -webkit-font-smoothing: antialiased;
  transition: left .38s cubic-bezier(.4,0,.2,1),
              top .38s cubic-bezier(.4,0,.2,1),
              opacity .15s .3s ease;
}

/* ── RESTART ─────────────────────────────────── */
#restart {
  display: none;
  padding: 14px 0 0 78px;
}
#restart button {
  width: 100%;
  background: var(--yellow);
  border: none; border-radius: 100px;
  font-family: 'Poppins', sans-serif;
  font-size: 14px; font-weight: 800;
  padding: 15px;
  cursor: pointer;
  transition: background .12s, transform .1s;
  margin-bottom: 10px;
}
#restart button:hover  { background: #d9a202; }
#restart button:active { transform: scale(.98); }
</style>
</head>
<body>
<div id="bg-hero"><img src="bg_jacek.webp" alt=""></div>
<div id="bg-mobile"><img src="mobile_full_screen.webp" alt=""></div>
<div id="app">

  <!-- INTRO STATE -->
  <div id="intro-wrap">
    <div id="intro-area">
      <div class="intro-row">
        <div class="intro-av-wrap">
          <div class="intro-av"><img src="jacek-avatar.webp" alt="Jacek Cygan"></div>
          <div class="intro-av-name">Jacek<br>Cygan</div>
        </div>
        <div class="intro-bubble">Cześć 👋 tu Jacek Cygan!<br>Planujesz coś obejrzeć dziś wieczór?<br>Pomogę Ci wybrać.</div>
      </div>
    </div>
    <div id="intro-choices"></div>
  </div>

  <!-- CHAT STATE (hidden until started) -->
  <div id="chat-wrap" style="display:none;">
    <div id="msgs"></div>
    <div id="choices"></div>
    <div id="restart"><button onclick="restartChat()">🔄 Jeszcze raz od początku</button></div>
  </div>
</div>

const TMDB_KEY = '8265bd1679663a7ea12ac168da84d2e8';
async function fetchPoster(imdbId) {
  try {
    const r = await fetch(`https://api.themoviedb.org/3/find/${imdbId}?api_key=${TMDB_KEY}&external_source=imdb_id`);
    const d = await r.json();
    const item = d.movie_results?.[0] || d.tv_results?.[0];
    return item?.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : null;
  } catch { return null; }
}

// ── AUDIO ──────────────────────────────────────
let _ctx;
function ctx() {
  if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
  return _ctx;
}

function playMsg() {
  const c = ctx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.connect(g); g.connect(c.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(880, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(1100, c.currentTime + 0.06);
  g.gain.setValueAtTime(0.18, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.18);
  o.start(c.currentTime);
  o.stop(c.currentTime + 0.18);
}

function playChoices() {
  const c = ctx();
  [0, 0.07, 0.14].forEach((t, i) => {
    const o = c.createOscillator();
    const g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = 'sine';
    const freq = 520 + i * 80;
    o.frequency.setValueAtTime(freq, c.currentTime + t);
    g.gain.setValueAtTime(0.10, c.currentTime + t);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t + 0.14);
    o.start(c.currentTime + t);
    o.stop(c.currentTime + t + 0.14);
  });
}

function playClick() {
  const c = ctx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.connect(g); g.connect(c.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(440, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(300, c.currentTime + 0.07);
  g.gain.setValueAtTime(0.12, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.1);
  o.start(c.currentTime);
  o.stop(c.currentTime + 0.1);
}

function init() {

  b1.onclick = () => { playClick(); startConv('start', b1); };

  const b2 = document.createElement('button');

  b2.onclick = () => { playClick(); startConv('surprise', b2); };

  introChoicesEl.appendChild(b1);
  introChoicesEl.appendChild(b2);
}

function flyToRight(btn, onDone) {
  const r = btn.getBoundingClientRect();
  /* pin in place without changing size */
  btn.style.position      = 'fixed';
  btn.style.left          = r.left + 'px';
  btn.style.top           = r.top  + 'px';
  btn.style.width         = r.width  + 'px';
  btn.style.height        = r.height + 'px';
  btn.style.whiteSpace    = 'nowrap';
  btn.style.overflow      = 'hidden';
  btn.style.margin        = '0';
  btn.style.zIndex        = '999';
  btn.style.pointerEvents = 'none';
  document.body.appendChild(btn);

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const appRect = document.getElementById('app').getBoundingClientRect();
    const dx = (appRect.right - r.right);
    const dy = (appRect.top + 8) - r.top;
    btn.style.transition = 'transform .38s cubic-bezier(.4,0,.2,1), opacity .15s .30s ease';
    btn.style.transform  = `translate(${dx}px,${dy}px)`;
    btn.style.opacity    = '0';
    setTimeout(() => { btn.remove(); onDone(); }, 480);
  }));
}

function startConv(node, clickedBtn) {
  const label = node === 'surprise' ? '🎲 Zaskocz mnie!' : '👍 Dawaj!';

  /* measure BEFORE hiding intro */
  if (clickedBtn) flyToRight(clickedBtn, () => addBubble('u', label));

  /* hide intro, show chat */
  introWrap.style.display = 'none';
  chatWrap.style.display  = 'flex';
  document.body.classList.add('chat-active');

  if (!clickedBtn) addBubble('u', label);

  const delay = clickedBtn ? 520 : 100;
  if (node === 'surprise') {
    const pick = SURPRISE[Math.floor(Math.random()*SURPRISE.length)];
    setTimeout(() => {
      typeSeq(["nie pytam – po prostu wiem co lubisz 😎", "oto mój typ na dziś wieczór:"], () => showResult(TREE[pick].result));
    }, delay);
  } else {
    setTimeout(() => renderNode('start'), delay);
  }
}

function renderNode(key) {
  const node = TREE[key];
  if (!node) return;
  choicesEl.innerHTML = '';
  typeSeq(node.msgs, () => {
    if (node.result) showResult({ ...node.result, _alt: node.alt });
    else             showChoices(node.choices);
  });
}

function typeSeq(msgs, done) {
  let i = 0;
  function next() {
    if (i >= msgs.length) { done && done(); return; }
    const txt = msgs[i++];
    const tyEl = addTyping();
    const delay = 1000 + Math.min(txt.length * 18, 1600);
    setTimeout(() => {
      tyEl.remove();
      addBubble('j', txt);
      setTimeout(next, 260);
    }, delay);
  }
  next();
}

function addTyping() {
  const el = document.createElement('div');
  el.className = 'msg-j';
  el.innerHTML = `
    <div class="msg-j-av"><img src="jacek-avatar.webp" alt="Jacek"></div>
    <div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  msgsEl.appendChild(el);
  scrollBot();
  return el;
}

function addBubble(who, txt) {
  const el = document.createElement('div');
  el.className = `msg-${who}`;
  const html = txt.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  if (who === 'j') {
    el.innerHTML = `
      <div class="msg-j-av"><img src="jacek-avatar.webp" alt="Jacek"></div>
      <div class="bubble">${html}</div>`;
    playMsg();
  } else {
    el.innerHTML = `<div class="bubble">${html}</div>`;
  }
  msgsEl.appendChild(el);
  scrollBot();
}

function showChoices(choices) {
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'ch';
    btn.innerHTML = `<span class="ch-ic">${c.ic}</span>${c.text}`;
    btn.onclick = () => {
      playClick();
      const label = c.ic + ' ' + c.text;

      /* fade out other buttons, keep btn in DOM for measurement */
      choicesEl.querySelectorAll('.ch').forEach(b => {
        if (b !== btn) { b.style.transition='opacity .15s'; b.style.opacity='0'; }
      });

      /* flyToRight measures btn position while still in DOM, then appends to body */
      flyToRight(btn, () => {
        addBubble('u', label);
        setTimeout(() => renderNode(c.next), 380);
      });
    };
    choicesEl.appendChild(btn);
  });
  playChoices();
  scrollBot();
}

function showResult(r) {
  const el = document.createElement('div');
  el.className = 'msg-j';
  const tags = r.tags.map(t=>`<span class="rc-tag">${t}</span>`).join('');
  const posterArea = document.createElement('div');
  posterArea.innerHTML = `<div class="rc-poster-fallback">${r.emoji}</div>`;
  const card = document.createElement('div');
  card.className = 'result-card';
  card.appendChild(posterArea);
  const body = document.createElement('div');
  body.className = 'rc-body';
  body.innerHTML = `
    <div class="rc-title">${r.title}</div>
    <div class="rc-orig">${r.orig}</div>
    <div class="rc-tags">${tags}</div>
    <div class="rc-desc">${r.desc}</div>
    <div class="rc-where">Dostępne na <span class="rc-where-badge">${r.badge}</span> w pakietach Vectra</div>`;
  card.appendChild(body);
  const av = document.createElement('div');
  av.className = 'msg-j-av';
  av.innerHTML = `<img src="jacek-avatar.webp" alt="Jacek">`;
  el.appendChild(av);
  el.appendChild(card);
  msgsEl.appendChild(el);
  scrollBot();

  // async poster fetch
  if (r.imdbId) {
    fetchPoster(r.imdbId).then(url => {
      if (url) {
        const img = document.createElement('img');
        img.className = 'rc-poster';
        img.alt = r.title;
        img.src = url;
        img.onerror = () => {}; // keep fallback if broken
        posterArea.innerHTML = '';
        posterArea.appendChild(img);
        scrollBot();
      }
    });
  }

  setTimeout(() => {
    typeSeq(["to mój typ na ten wieczór!\n\njeśli chcesz coś innego – wróć i spróbuj jeszcze raz"], () => {
      choicesEl.innerHTML = '';
      restartEl.innerHTML = '';
      if (r._alt) {
        const seenBtn = document.createElement('button');
        seenBtn.textContent = 'Już to widziałem/am';
        restartEl.appendChild(seenBtn);
        seenBtn.onclick = () => {
          playClick();
          restartEl.style.display = 'none';
          addBubble('u', 'Już to widziałem/am');
          setTimeout(() => {
            typeSeq(["dobra, to w podobnym stylu – mam coś innego dla Ciebie:"], () => {
              showResult(r._alt);
            });
          }, 400);
        };
      }
      const againBtn = document.createElement('button');
      againBtn.innerHTML = '🔄 Jeszcze raz od początku';
      againBtn.onclick = restartChat;
      restartEl.appendChild(againBtn);
      restartEl.style.display = 'block';
      scrollBot();
      setTimeout(() => {
        if (window.innerWidth <= 900) {
          document.body.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
          document.documentElement.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
        } else {
          appEl.scrollTop = appEl.scrollHeight;
        }
        restartEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 200);
    });
  }, 350);
}

const appEl = document.getElementById('app');
function scrollBot() {
  setTimeout(() => {
    if (window.innerWidth <= 900) {
      document.body.scrollTo(0, document.body.scrollHeight);
      document.documentElement.scrollTo(0, document.documentElement.scrollHeight);
    } else {
      appEl.scrollTop = appEl.scrollHeight;
    }
  }, 50);
}

function restartChat() { init(); }

init();
</script>
</body>
</html>
